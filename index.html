<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>НікусДія</title>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Raleway:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --ua-blue: #005BBB; --ua-yellow: #FFD700; --ua-yellow-light: #FFF3B0;
      --bg: #F0F4FF; --bg2: #E8EDF8; --card: #FFFFFF;
      --text: #0D1B2A; --text2: #4A5568; --accent: #005BBB; --accent2: #0073E6;
      --danger: #E53E3E; --success: #38A169; --border: #D0DAF0;
      --shadow: 0 4px 24px rgba(0,91,187,0.10); --shadow-lg: 0 12px 48px rgba(0,91,187,0.18);
      --radius: 16px; --radius-sm: 10px;
      --infected: #C53030; --survivor: #276749;
      --power1: #68D391; --power2: #F6AD55; --power3: #FC8181;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Raleway', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    .app-wrap { max-width: 480px; margin: 0 auto; min-height: 100vh; background: var(--bg); position: relative; }
    .header { background: linear-gradient(135deg, #003F8A 0%, #005BBB 60%, #0073E6 100%); padding: 16px 20px 14px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 20px rgba(0,63,138,0.4); }
    .header-logo { width: 38px; height: 38px; background: var(--ua-yellow); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-family: 'Unbounded', sans-serif; font-size: 13px; font-weight: 800; color: var(--ua-blue); letter-spacing: -0.5px; flex-shrink: 0; box-shadow: 0 2px 8px rgba(255,215,0,0.4); }
    .header-title { font-family: 'Unbounded', sans-serif; font-size: 17px; font-weight: 700; color: white; letter-spacing: -0.3px; }
    .header-sub { font-size: 10px; color: rgba(255,255,255,0.65); font-weight: 400; margin-top: 1px; letter-spacing: 0.5px; }
    .header-logout { margin-left: auto; background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 7px 14px; border-radius: 8px; font-size: 13px; cursor: pointer; font-family: 'Raleway', sans-serif; font-weight: 600; transition: background 0.2s; white-space: nowrap; }
    .header-logout:hover { background: rgba(255,255,255,0.25); }
    .auth-page { min-height: 100vh; background: linear-gradient(160deg, #003F8A 0%, #005BBB 45%, #0099CC 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 24px; position: relative; overflow: hidden; }
    .auth-page::before { content: ''; position: absolute; width: 400px; height: 400px; background: var(--ua-yellow); opacity: 0.06; border-radius: 50%; top: -100px; right: -100px; }
    .auth-page::after { content: ''; position: absolute; width: 300px; height: 300px; background: white; opacity: 0.04; border-radius: 50%; bottom: -80px; left: -80px; }
    .auth-logo-big { width: 80px; height: 80px; background: var(--ua-yellow); border-radius: 22px; display: flex; align-items: center; justify-content: center; font-family: 'Unbounded', sans-serif; font-size: 20px; font-weight: 800; color: #003F8A; margin-bottom: 12px; box-shadow: 0 8px 32px rgba(255,215,0,0.5); position: relative; z-index: 1; }
    .auth-title-big { font-family: 'Unbounded', sans-serif; font-size: 26px; font-weight: 800; color: white; letter-spacing: -1px; margin-bottom: 6px; position: relative; z-index: 1; }
    .auth-subtitle { font-size: 13px; color: rgba(255,255,255,0.65); margin-bottom: 32px; position: relative; z-index: 1; text-align: center; }
    .auth-card { background: white; border-radius: 24px; padding: 28px 24px; width: 100%; max-width: 380px; box-shadow: 0 24px 80px rgba(0,0,0,0.3); position: relative; z-index: 1; }
    .auth-tabs { display: flex; background: var(--bg2); border-radius: 10px; padding: 3px; margin-bottom: 24px; }
    .auth-tab { flex: 1; padding: 9px; border: none; background: transparent; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; color: var(--text2); font-family: 'Raleway', sans-serif; transition: all 0.2s; }
    .auth-tab.active { background: white; color: var(--accent); box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .input-group { margin-bottom: 16px; }
    .input-label { font-size: 12px; font-weight: 700; color: var(--text2); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    .input-field { width: 100%; padding: 13px 16px; border: 2px solid var(--border); border-radius: var(--radius-sm); font-size: 15px; font-family: 'Raleway', sans-serif; color: var(--text); background: var(--bg); transition: border-color 0.2s; outline: none; }
    .input-field:focus { border-color: var(--accent); background: white; }
    .btn-primary { width: 100%; padding: 15px; background: linear-gradient(135deg, #003F8A, #005BBB); color: white; border: none; border-radius: var(--radius-sm); font-size: 15px; font-weight: 700; cursor: pointer; font-family: 'Raleway', sans-serif; letter-spacing: 0.3px; transition: transform 0.15s, box-shadow 0.15s; box-shadow: 0 4px 16px rgba(0,91,187,0.4); }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0,91,187,0.5); }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .btn-google { width: 100%; padding: 13px; background: white; color: var(--text); border: 2px solid var(--border); border-radius: var(--radius-sm); font-size: 14px; font-weight: 600; cursor: pointer; font-family: 'Raleway', sans-serif; display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 12px; transition: border-color 0.2s, background 0.2s; }
    .btn-google:hover { border-color: #4285F4; background: #F8F9FF; }
    .divider { display: flex; align-items: center; gap: 12px; margin: 16px 0; color: var(--text2); font-size: 12px; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .error-msg { background: #FFF5F5; border: 1px solid #FEB2B2; color: var(--danger); padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; }
    .setup-page { padding: 24px 20px; max-width: 480px; margin: 0 auto; }
    .setup-title { font-family: 'Unbounded', sans-serif; font-size: 20px; font-weight: 700; color: var(--accent); margin-bottom: 6px; }
    .setup-sub { font-size: 13px; color: var(--text2); margin-bottom: 28px; line-height: 1.5; }
    .photo-upload { display: flex; flex-direction: column; align-items: center; margin-bottom: 24px; }
    .photo-circle { width: 100px; height: 100px; border-radius: 50%; border: 3px dashed var(--border); display: flex; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; background: var(--bg2); transition: border-color 0.2s; position: relative; }
    .photo-circle:hover { border-color: var(--accent); }
    .photo-circle img { width: 100%; height: 100%; object-fit: cover; }
    .photo-hint { font-size: 12px; color: var(--text2); margin-top: 8px; text-align: center; }
    .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: white; border-top: 1px solid var(--border); display: flex; z-index: 100; box-shadow: 0 -4px 20px rgba(0,0,0,0.08); }
    .nav-item { flex: 1; padding: 10px 2px 8px; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; border: none; background: transparent; color: var(--text2); font-size: 9px; font-family: 'Raleway', sans-serif; font-weight: 600; transition: color 0.2s; }
    .nav-item.active { color: var(--accent); }
    .nav-icon { font-size: 20px; line-height: 1; }
    .page-content { padding: 20px; padding-bottom: 90px; }
    .id-card { background: linear-gradient(135deg, #003F8A 0%, #005BBB 50%, #0073E6 100%); border-radius: 22px; padding: 24px; color: white; position: relative; overflow: hidden; margin-bottom: 20px; box-shadow: var(--shadow-lg); min-height: 200px; }
    .id-card::before { content: ''; position: absolute; width: 250px; height: 250px; background: rgba(255,255,255,0.06); border-radius: 50%; top: -80px; right: -60px; }
    .id-card::after { content: ''; position: absolute; width: 180px; height: 180px; background: rgba(255,215,0,0.08); border-radius: 50%; bottom: -60px; left: -40px; }
    .id-card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; position: relative; z-index: 1; }
    .id-card-logo-img { width: 32px; height: 32px; border-radius: 6px; object-fit: cover; flex-shrink: 0; }
    .id-card-app-name { font-family: 'Unbounded', sans-serif; font-size: 13px; font-weight: 700; color: rgba(255,255,255,0.9); letter-spacing: 0.5px; }
    .id-card-doc-type { font-size: 10px; color: rgba(255,255,255,0.55); letter-spacing: 1px; text-transform: uppercase; margin-top: 1px; }
    .id-card-body { display: flex; gap: 18px; position: relative; z-index: 1; }
    .id-photo { width: 72px; height: 88px; border-radius: 10px; overflow: hidden; border: 2px solid rgba(255,255,255,0.3); flex-shrink: 0; background: rgba(255,255,255,0.15); display: flex; align-items: center; justify-content: center; font-size: 28px; }
    .id-photo img { width: 100%; height: 100%; object-fit: cover; }
    .id-info { flex: 1; }
    .id-name { font-family: 'Unbounded', sans-serif; font-size: 16px; font-weight: 700; line-height: 1.2; margin-bottom: 12px; }
    .id-row { display: flex; gap: 20px; margin-bottom: 6px; }
    .id-field-label { font-size: 9px; color: rgba(255,255,255,0.5); letter-spacing: 0.8px; text-transform: uppercase; margin-bottom: 2px; }
    .id-field-value { font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.95); }
    .id-card-bottom { position: relative; z-index: 1; margin-top: 16px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.15); display: flex; align-items: center; justify-content: space-between; }
    .id-number { font-family: 'Unbounded', sans-serif; font-size: 11px; color: rgba(255,255,255,0.5); letter-spacing: 1px; }
    .id-status-badge { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.25); color: white; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; }
    .id-status-badge.banned { background: rgba(229,62,62,0.3); border-color: rgba(229,62,62,0.5); }
    .section-title { font-family: 'Unbounded', sans-serif; font-size: 14px; font-weight: 700; color: var(--accent); margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
    .info-card { background: white; border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); margin-bottom: 14px; border: 1px solid var(--border); }
    .info-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--bg2); }
    .info-row:last-child { border-bottom: none; }
    .info-row-label { font-size: 12px; color: var(--text2); font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; }
    .info-row-value { font-size: 14px; font-weight: 600; color: var(--text); text-align: right; max-width: 60%; word-break: break-word; }
    .report-card { background: white; border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow); margin-bottom: 12px; border: 1px solid var(--border); border-left: 4px solid var(--accent); }
    .report-card.unread { border-left-color: var(--ua-yellow); background: #FFFDF0; }
    .report-type { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: var(--accent); margin-bottom: 4px; }
    .report-title { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
    .report-body { font-size: 13px; color: var(--text2); line-height: 1.5; margin-bottom: 8px; }
    .report-date { font-size: 11px; color: #A0AEC0; }
    .court-card { background: white; border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow); margin-bottom: 12px; border: 1px solid var(--border); }
    .court-status { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; margin-bottom: 8px; }
    .court-status.pending { background: #EBF8FF; color: #2B6CB0; }
    .court-status.approved { background: #F0FFF4; color: #276749; }
    .court-status.rejected { background: #FFF5F5; color: #C53030; }
    .court-title { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
    .court-sub { font-size: 13px; color: var(--text2); line-height: 1.4; margin-bottom: 8px; }
    .court-meta { font-size: 11px; color: #A0AEC0; }
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; display: flex; align-items: flex-end; justify-content: center; }
    .modal-sheet { background: white; border-radius: 24px 24px 0 0; padding: 24px 20px 40px; width: 100%; max-width: 480px; max-height: 92vh; overflow-y: auto; animation: slideUp 0.3s ease; }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .modal-handle { width: 40px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 20px; }
    .modal-title { font-family: 'Unbounded', sans-serif; font-size: 17px; font-weight: 700; color: var(--text); margin-bottom: 20px; }
    .textarea-field { width: 100%; padding: 13px 16px; border: 2px solid var(--border); border-radius: var(--radius-sm); font-size: 14px; font-family: 'Raleway', sans-serif; color: var(--text); background: var(--bg); resize: vertical; min-height: 100px; outline: none; transition: border-color 0.2s; }
    .textarea-field:focus { border-color: var(--accent); background: white; }
    .btn-secondary { width: 100%; padding: 14px; background: var(--bg2); color: var(--text); border: none; border-radius: var(--radius-sm); font-size: 14px; font-weight: 600; cursor: pointer; font-family: 'Raleway', sans-serif; margin-top: 10px; }
    .admin-badge { background: linear-gradient(135deg, #744210, #D69E2E); color: white; padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 700; letter-spacing: 0.5px; }
    .admin-user-card { background: white; border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); margin-bottom: 12px; border: 1px solid var(--border); display: flex; align-items: center; gap: 12px; cursor: pointer; transition: box-shadow 0.2s; }
    .admin-user-card:hover { box-shadow: var(--shadow-lg); }
    .user-mini-photo { width: 44px; height: 44px; border-radius: 50%; background: var(--bg2); display: flex; align-items: center; justify-content: center; font-size: 20px; overflow: hidden; flex-shrink: 0; border: 2px solid var(--border); }
    .user-mini-photo img { width: 100%; height: 100%; object-fit: cover; }
    .btn-danger { padding: 10px 16px; background: var(--danger); color: white; border: none; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: 'Raleway', sans-serif; transition: opacity 0.2s; }
    .btn-danger:hover { opacity: 0.85; }
    .btn-success { padding: 10px 16px; background: var(--success); color: white; border: none; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: 'Raleway', sans-serif; }
    .btn-outline { padding: 10px 16px; background: transparent; color: var(--accent); border: 2px solid var(--accent); border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: 'Raleway', sans-serif; }
    .empty-state { text-align: center; padding: 48px 24px; color: var(--text2); }
    .empty-state-icon { font-size: 48px; margin-bottom: 12px; }
    .empty-state-text { font-size: 14px; line-height: 1.5; }
    .spinner { width: 40px; height: 40px; border: 4px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 60px auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .fab { position: fixed; bottom: 80px; right: 20px; width: 56px; height: 56px; border-radius: 50%; background: linear-gradient(135deg, #003F8A, #005BBB); color: white; font-size: 26px; border: none; cursor: pointer; box-shadow: 0 6px 20px rgba(0,91,187,0.5); display: flex; align-items: center; justify-content: center; z-index: 99; transition: transform 0.2s; }
    .fab:hover { transform: scale(1.08); }
    .select-field { width: 100%; padding: 13px 16px; border: 2px solid var(--border); border-radius: var(--radius-sm); font-size: 15px; font-family: 'Raleway', sans-serif; color: var(--text); background: var(--bg); outline: none; appearance: none; }
    .court-admin-btns { display: flex; gap: 8px; margin-top: 10px; }
    .history-card { background: white; border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); margin-bottom: 10px; border: 1px solid var(--border); }
    .notif-dot { width: 8px; height: 8px; background: #E53E3E; border-radius: 50%; position: absolute; top: 4px; right: 4px; }
    #root { min-height: 100vh; }
    .game-header-banner { background: linear-gradient(135deg, #1a0a2e 0%, #2d1b69 50%, #11998e 100%); border-radius: 18px; padding: 20px; margin-bottom: 18px; position: relative; overflow: hidden; }
    .game-header-banner::before { content: '🧟'; position: absolute; right: 16px; top: 50%; transform: translateY(-50%); font-size: 52px; opacity: 0.25; }
    .game-banner-title { font-family: 'Unbounded', sans-serif; font-size: 18px; font-weight: 800; color: white; margin-bottom: 4px; }
    .game-banner-sub { font-size: 12px; color: rgba(255,255,255,0.65); }
    .game-banner-stats { display: flex; gap: 14px; margin-top: 14px; }
    .game-stat-pill { background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2); border-radius: 20px; padding: 6px 14px; font-size: 12px; font-weight: 700; color: white; }
    .schedule-day-block { background: white; border-radius: 14px; box-shadow: var(--shadow); margin-bottom: 12px; border: 1px solid var(--border); overflow: hidden; }
    .schedule-day-header { padding: 12px 16px; background: linear-gradient(90deg, #003F8A, #0073E6); display: flex; justify-content: space-between; align-items: center; }
    .schedule-day-name { font-family: 'Unbounded', sans-serif; font-size: 12px; font-weight: 700; color: white; }
    .schedule-day-date { font-size: 11px; color: rgba(255,255,255,0.7); }
    .schedule-break-row { padding: 10px 14px; border-bottom: 1px solid var(--bg2); display: flex; align-items: center; gap: 10px; }
    .schedule-break-row:last-child { border-bottom: none; }
    .break-label { font-size: 11px; font-weight: 700; color: var(--text2); min-width: 54px; }
    .break-duration { font-size: 10px; color: #A0AEC0; min-width: 32px; }
    .infected-slot { display: flex; gap: 6px; flex: 1; flex-wrap: wrap; }
    .infected-chip { display: flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 20px; font-size: 11px; font-weight: 700; }
    .infected-chip.p1 { background: #C6F6D5; color: #276749; }
    .infected-chip.p2 { background: #FEFCBF; color: #744210; }
    .infected-chip.p3 { background: #FED7D7; color: #C53030; }
    .infected-chip.dayoff { background: #E9D8FD; color: #553C9A; font-style: italic; }
    .break-empty { font-size: 11px; color: #CBD5E0; font-style: italic; }
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .stat-card { background: white; border-radius: 12px; padding: 14px; box-shadow: var(--shadow); border: 1px solid var(--border); text-align: center; }
    .stat-card-val { font-family: 'Unbounded', sans-serif; font-size: 22px; font-weight: 800; color: var(--accent); }
    .stat-card-label { font-size: 10px; color: var(--text2); font-weight: 600; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
    .player-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--bg2); }
    .player-row:last-child { border-bottom: none; }
    .player-avatar-sm { width: 36px; height: 36px; border-radius: 50%; overflow: hidden; background: var(--bg2); display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; border: 2px solid var(--border); }
    .player-avatar-sm img { width: 100%; height: 100%; object-fit: cover; }
    .player-info-name { font-size: 13px; font-weight: 700; color: var(--text); }
    .player-info-sub { font-size: 11px; color: var(--text2); }
    .infected-count-badge { background: var(--danger); color: white; border-radius: 20px; padding: 2px 8px; font-size: 11px; font-weight: 700; margin-left: auto; }
    .turns-bar-wrap { flex: 1; margin-left: 10px; }
    .turns-bar-bg { background: var(--bg2); border-radius: 4px; height: 6px; overflow: hidden; }
    .turns-bar-fill { background: linear-gradient(90deg, #005BBB, #0073E6); height: 100%; border-radius: 4px; transition: width 0.4s; }
    .power-selector { display: flex; gap: 8px; margin-bottom: 16px; }
    .power-btn { flex: 1; padding: 10px 4px; border: 2px solid var(--border); border-radius: 10px; background: white; font-size: 12px; font-weight: 700; cursor: pointer; font-family: 'Raleway', sans-serif; transition: all 0.2s; text-align: center; }
    .power-btn.p1.sel { border-color: #276749; background: #F0FFF4; color: #276749; }
    .power-btn.p2.sel { border-color: #744210; background: #FFFAF0; color: #744210; }
    .power-btn.p3.sel { border-color: #C53030; background: #FFF5F5; color: #C53030; }
    .player-select-list { max-height: 240px; overflow-y: auto; border: 1px solid var(--border); border-radius: 10px; margin-bottom: 12px; }
    .player-select-item { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--bg2); cursor: pointer; transition: background 0.15s; }
    .player-select-item:last-child { border-bottom: none; }
    .player-select-item:hover { background: var(--bg2); }

  const BREAKS = [
    { id: 1, label: "1 перерва", after: 1, duration: 10 },
    { id: 2, label: "2 перерва", after: 2, duration: 30 },
    { id: 3, label: "3 перерва", after: 3, duration: 10 },

  const DAY_NAMES = ["","Пн","Вт","Ср","Чт","Пт","Сб","Нд"];

  function formatDate(ts) {
    if (!ts) return "—";
    const d = ts.toDate ? ts.toDate() : (ts.seconds ? new Date(ts.seconds * 1000) : new Date(ts));
    return d.toLocaleDateString("uk-UA", { day: "2-digit", month: "2-digit", year: "numeric" });

  function generateScheduleDates(from = new Date()) {
    const dates = [];
    let d = new Date(from);
    d.setHours(0,0,0,0);
    const dayOfWeek = d.getDay();
    if (dayOfWeek === 0) d.setDate(d.getDate() + 1);
    else if (dayOfWeek === 6) d.setDate(d.getDate() + 2);
    while (dates.length < 10) {
      if (d.getDay() !== 0 && d.getDay() !== 6) dates.push(new Date(d));
      d.setDate(d.getDate() + 1);
    }
    return dates;
  }

function autoGenerateSchedule(players, existingSlots = {}) {
  const activePlayers = players.filter(p => !p.bannedFromGame);
  if (activePlayers.length < 1) return {};

  const getP = p => (p.power && p.power >= 1 && p.power <= 3) ? p.power : 1;

  // Рахуємо навантаження в одиницях сили (не просто кількість слотів)
  const load = {};
  activePlayers.forEach(p => { load[p.uid] = 0; });
  Object.values(existingSlots).forEach(slot => {
    slot?.infected?.forEach(inf => {
      if (load[inf.uid] !== undefined) load[inf.uid] += (inf.power || 1);
    });
  });

  const newSlots = { ...existingSlots };
  const dates = generateScheduleDates();

  dates.forEach(date => {
    const dateKey = date.toISOString().split("T")[0];
    BREAKS.forEach(br => {
      const slotKey = `${dateKey}_${br.id}`;
      if (newSlots[slotKey]) return;

      // Сортуємо від найменш навантаженого (за сумою сили)
      const sorted = [...activePlayers].sort((a, b) => (load[a.uid] || 0) - (load[b.uid] || 0));

      // Будуємо всі валідні комбінації з сумою сил = 3
      const candidates = [];

      // Варіант 1: один гравець з силою 3
      for (const p of sorted) {
        if (getP(p) === 3) {
          candidates.push({ combo: [p], totalLoad: load[p.uid] });
          break; // беремо найменш навантаженого з силою 3
        }
      }

      // Варіант 2: сила 2 + сила 1
      const p2list = sorted.filter(p => getP(p) === 2);
      const p1list = sorted.filter(p => getP(p) === 1);
      if (p2list.length >= 1 && p1list.length >= 1) {
        const best2 = p2list[0];
        const best1 = p1list[0];
        candidates.push({
          combo: [best2, best1],
          totalLoad: load[best2.uid] + load[best1.uid]
        });
      }

      // Варіант 3: три гравці з силою 1
      if (p1list.length >= 3) {
        const trio = p1list.slice(0, 3);
        candidates.push({
          combo: trio,
          totalLoad: trio.reduce((s, p) => s + load[p.uid], 0)
        });
      }

      // Якщо немає жодного валідного варіанту — fallback: беремо кого є
      if (candidates.length === 0) {
        const fallback = sorted.slice(0, 1);
        newSlots[slotKey] = {
          infected: fallback.map(p => ({ uid: p.uid, name: `${p.firstName} ${p.lastName || ""}`.trim(), power: getP(p) })),
          dayOff: []
        };
        fallback.forEach(p => { load[p.uid] += getP(p); });
        return;
      }

      // Обираємо комбінацію з мінімальним сумарним навантаженням
      candidates.sort((a, b) => a.totalLoad - b.totalLoad);
      const best = candidates[0].combo;

      newSlots[slotKey] = {
        infected: best.map(p => ({ uid: p.uid, name: `${p.firstName} ${p.lastName || ""}`.trim(), power: getP(p) })),
        dayOff: []
      };
      best.forEach(p => { load[p.uid] += getP(p); });
    });
  });

  return newSlots;
}

  // ── НОВА ФУНКЦІЯ: оптимізація графіку для боржників ──
  // Логіка:
  // 1. Рахуємо debt = кількість слотів де гравець є в dayOff (прогуляв)
  // 2. Рахуємо realTurns = скільки разів гравець реально відіграв в infected
  // 3. Боржники (debt > 0) сортуються по debt desc
  // 4. Для кожного боржника шукаємо слоти де є "багатій" (найбільше realTurns),
  //    якого можна замінити на боржника не зламавши суму сили слоту
  // 5. Існуючі слоти без dayOff і без боржників — не чіпаємо

function optimizeSchedule(players, existingSlots, penalties = [], debtDecisions = {}) {
  // debtDecisions: { "uid_slotKey": "skip" | "replace_slotKey_target" }
  const activePlayers = players.filter(p => !p.bannedFromGame);
  if (activePlayers.length < 1) return existingSlots;

  const getP = p => (p.power && p.power >= 1 && p.power <= 3) ? p.power : 1;

  const originalLoad = {};
  activePlayers.forEach(p => { originalLoad[p.uid] = 0; });
  Object.values(existingSlots).forEach(slot => {
    slot?.infected?.forEach(inf => {
      if (originalLoad[inf.uid] !== undefined) originalLoad[inf.uid] += (inf.power || 1);
    });
  });
  penalties.forEach(pen => {
    if (pen.type === "fine" && originalLoad[pen.uid] !== undefined) {
      originalLoad[pen.uid] += (pen.value || 0);
    }
  });

  const localLoad = { ...originalLoad };
  const newSlots = JSON.parse(JSON.stringify(existingSlots));

  // Збираємо всіх боржників та їх dayOff слоти
  const debtorSlots = {}; // uid -> [slotKey, ...]
  activePlayers.forEach(p => { debtorSlots[p.uid] = []; });
  Object.entries(existingSlots).forEach(([slotKey, slot]) => {
    slot?.dayOff?.forEach(uid => {
      if (debtorSlots[uid] !== undefined) debtorSlots[uid].push(slotKey);
    });
  });

  for (const debtor of activePlayers) {
    const myDebtSlots = debtorSlots[debtor.uid];
    if (!myDebtSlots || myDebtSlots.length === 0) continue;

    const debtorPower = getP(debtor);

    for (const debtSlotKey of myDebtSlots) {
      const decisionKey = `${debtor.uid}__${debtSlotKey}`;
      const decision = debtDecisions[decisionKey];

      if (!decision || decision === "skip") {
        // Справжній прогул — замінюємо боржника в майбутньому слоті
        // Шукаємо слот де є гравець з тією ж силою і більшим навантаженням
        const candidateSlots = Object.keys(newSlots).filter(key => {
          if (key === debtSlotKey) return false;
          const slot = newSlots[key];
          if (!slot?.infected || slot.infected.length === 0) return false;
          if (slot.infected.some(i => i.uid === debtor.uid)) return false;
          if (slot.dayOff?.includes(debtor.uid)) return false;
          return slot.infected.some(i => i.uid !== debtor.uid && i.power === debtorPower);
        });

        candidateSlots.sort((a, b) => {
          const maxA = Math.max(...newSlots[a].infected
            .filter(i => i.power === debtorPower && i.uid !== debtor.uid)
            .map(i => originalLoad[i.uid] || 0));
          const maxB = Math.max(...newSlots[b].infected
            .filter(i => i.power === debtorPower && i.uid !== debtor.uid)
            .map(i => originalLoad[i.uid] || 0));
          return maxB - maxA;
        });

        for (const slotKey of candidateSlots) {
          const slot = newSlots[slotKey];
          const richCandidate = [...slot.infected]
            .filter(i => i.uid !== debtor.uid && i.power === debtorPower)
            .sort((a, b) => (originalLoad[b.uid] || 0) - (originalLoad[a.uid] || 0))[0];

          if (!richCandidate) continue;
          if ((originalLoad[richCandidate.uid] || 0) <= (originalLoad[debtor.uid] || 0)) continue;

          slot.infected = slot.infected.map(i =>
            i.uid === richCandidate.uid
              ? { uid: debtor.uid, name: `${debtor.firstName} ${debtor.lastName || ""}`.trim(), power: debtorPower }
              : i
          );
          localLoad[debtor.uid] = (localLoad[debtor.uid] || 0) + debtorPower;
          localLoad[richCandidate.uid] = Math.max(0, (localLoad[richCandidate.uid] || 0) - debtorPower);
          break;
        }

      } else if (decision.startsWith("date:")) {
        // Адмін обрав конкретний день — система обирає найкращу перерву
        const targetDate = decision.replace("date:", "");

        // Знаходимо всі слоти цього дня
        const daySlots = BREAKS.map(br => `${targetDate}_${br.id}`)
          .filter(key => {
            const slot = newSlots[key];
            if (!slot) return true; // порожній слот — можна додати
            if (slot.infected?.some(i => i.uid === debtor.uid)) return false; // вже є
            if (slot.dayOff?.includes(debtor.uid)) return false;
            // Перевіряємо чи є місце для заміни (така ж сила) або слот порожній
            const currentSum = (slot.infected || []).reduce((s, i) => s + (i.power || 1), 0);
            return currentSum < 3; // є місце
          });

        if (daySlots.length === 0) continue;

        // Обираємо слот де боржник найкраще вписується без ламання суми
        // Пріоритет: слот де currentSum + debtorPower === 3
        daySlots.sort((a, b) => {
          const slotA = newSlots[a] || { infected: [] };
          const slotB = newSlots[b] || { infected: [] };
          const sumA = (slotA.infected || []).reduce((s, i) => s + (i.power || 1), 0);
          const sumB = (slotB.infected || []).reduce((s, i) => s + (i.power || 1), 0);
          const fitA = Math.abs((sumA + debtorPower) - 3);
          const fitB = Math.abs((sumB + debtorPower) - 3);
          return fitA - fitB;
        });

        const bestSlotKey = daySlots[0];
        if (!newSlots[bestSlotKey]) {
          newSlots[bestSlotKey] = { infected: [], dayOff: [] };
        }
        const targetSlot = newSlots[bestSlotKey];
        const currentSum = (targetSlot.infected || []).reduce((s, i) => s + (i.power || 1), 0);

        if (currentSum + debtorPower <= 3) {
          targetSlot.infected = [
            ...(targetSlot.infected || []),
            { uid: debtor.uid, name: `${debtor.firstName} ${debtor.lastName || ""}`.trim(), power: debtorPower }
          ];
          localLoad[debtor.uid] = (localLoad[debtor.uid] || 0) + debtorPower;
        }
      }
    }
  }

  return newSlots;
}

    let myTurns = 0;

    const now = new Date(); now.setHours(0,0,0,0);

   Object.entries(slots).forEach(([key, slot]) => {
  if (!slot?.infected) return;
  const isMe = slot.infected.some(i => i.uid === userId);
  if (isMe) {
    myTurns++;

        if (d < prevD || (d.getTime() === prevD.getTime() && parseInt(brId) < parseInt(prevBrId))) {

        }
      }
    }
  }
});


    const myPenalties = (gameData?.penalties || []).filter(p => p.uid === userId);

                const slotKey = `${dateKey}_${br.id}`;

                const isMeInfected = slot?.infected?.some(i => i.uid === userId);

              });
              const hasMeToday = daySlots.some(s => s.isMeInfected);

                  ))}
                </div>
              </>
            )}
          </>
        )}

    );

  // ── AdminScheduleTab ──

function OptimizeModal({ players, slots, onConfirm, onClose }) {
  // Збираємо всі dayOff по гравцях
  const debtMap = []; // [{ debtor, slotKey, dateStr, br }]

  players.forEach(p => {
    Object.entries(slots).forEach(([slotKey, slot]) => {
      if (slot?.dayOff?.includes(p.uid)) {
        const [dateStr, brId] = slotKey.split("_");
        const br = BREAKS.find(b => b.id === parseInt(brId));
        if (br) debtMap.push({ debtor: p, slotKey, dateStr, br });
      }
    });
  });

  // Рішення: { "uid__slotKey": "skip" | "date:YYYY-MM-DD" }
  const [decisions, setDecisions] = useState(() => {
    const init = {};
    debtMap.forEach(({ debtor, slotKey }) => {
      init[`${debtor.uid}__${slotKey}`] = "skip";
    });
    return init;
  });

  // Для вибору дати
  const [pickingDate, setPickingDate] = useState(null); // "uid__slotKey"

  const availableDates = generateScheduleDates();

  function setDecision(key, value) {
    setDecisions(prev => ({ ...prev, [key]: value }));
  }

  if (debtMap.length === 0) {
    return (
      <div className="modal-backdrop" onClick={e => e.target === e.currentTarget && onClose()}>
        <div className="modal-sheet">
          <div className="modal-handle" />
          <div className="modal-title">⚡ Оптимізація</div>
          <div className="empty-state">
            <div className="empty-state-icon">✅</div>
            <div className="empty-state-text">Боржників немає — всі відпрацювали свої зміни!</div>
          </div>
          <button className="btn-secondary" onClick={onClose}>Закрити</button>
        </div>
      </div>
    );
  }

  // Групуємо по гравцях
  const byPlayer = {};
  debtMap.forEach(item => {
    const uid = item.debtor.uid;
    if (!byPlayer[uid]) byPlayer[uid] = { debtor: item.debtor, items: [] };
    byPlayer[uid].items.push(item);
  });

  return (
    <div className="modal-backdrop" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal-sheet">
        <div className="modal-handle" />
        <div className="modal-title">⚡ Оптимізація прогулів</div>
        <div style={{ fontSize: 13, color: "var(--text2)", marginBottom: 20, lineHeight: 1.5 }}>
          Оберіть для кожного прогулу що робити
        </div>

        {Object.values(byPlayer).map(({ debtor, items }) => (
          <div key={debtor.uid} style={{ marginBottom: 20 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 12 }}>
              <div className="user-mini-photo" style={{ width: 36, height: 36 }}>
                {debtor.photoUrl
                  ? <img src={debtor.photoUrl} alt="" />
                  : <span style={{ fontSize: 14 }}>{debtor.firstName?.[0] || "?"}</span>}
              </div>
              <div style={{ fontWeight: 700, fontSize: 15 }}>
                {debtor.firstName} {debtor.lastName}
                <span style={{ fontSize: 11, color: "var(--text2)", fontWeight: 400, marginLeft: 6 }}>
                  ⚡ сила {debtor.power || 1}
                </span>
              </div>
            </div>

            {items.map(({ slotKey, dateStr, br }) => {
              const decKey = `${debtor.uid}__${slotKey}`;
              const dec = decisions[decKey];
              const date = new Date(dateStr);
              const isPicking = pickingDate === decKey;

              return (
                <div key={slotKey} style={{
                  background: "var(--bg2)", borderRadius: 12, padding: "12px 14px",
                  marginBottom: 10, border: "1px solid var(--border)"
                }}>
                  <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 10 }}>
                    🌙 {DAY_NAMES[date.getDay()]}, {formatShortDate(date)} — {br.label}
                  </div>

                  <div style={{ display: "flex", gap: 8, marginBottom: isPicking ? 12 : 0 }}>
                    <button
                      onClick={() => { setDecision(decKey, "skip"); setPickingDate(null); }}
                      style={{
                        flex: 1, padding: "9px 6px", border: "2px solid",
                        borderColor: dec === "skip" ? "#C53030" : "var(--border)",
                        borderRadius: 10, background: dec === "skip" ? "#FFF5F5" : "white",
                        color: dec === "skip" ? "#C53030" : "var(--text2)",
                        fontWeight: 700, fontSize: 12, cursor: "pointer",
                        fontFamily: "'Raleway', sans-serif"
                      }}
                    >
                      ⛔ Справжній прогул
                    </button>
                    <button
                      onClick={() => setPickingDate(isPicking ? null : decKey)}
                      style={{
                        flex: 1, padding: "9px 6px", border: "2px solid",
                        borderColor: dec !== "skip" ? "#276749" : "var(--border)",
                        borderRadius: 10, background: dec !== "skip" ? "#F0FFF4" : "white",
                        color: dec !== "skip" ? "#276749" : "var(--text2)",
                        fontWeight: 700, fontSize: 12, cursor: "pointer",
                        fontFamily: "'Raleway', sans-serif"
                      }}
                    >
                      📅 {dec !== "skip" ? `${formatShortDate(new Date(dec.replace("date:", "")))}` : "Обрати день"}
                    </button>
                  </div>

                  {isPicking && (
                    <div style={{ marginTop: 8 }}>
                      <div style={{ fontSize: 11, color: "var(--text2)", marginBottom: 8, fontWeight: 600, textTransform: "uppercase", letterSpacing: 0.5 }}>
                        Оберіть день заміни:
                      </div>
                      <div style={{ display: "flex", flexDirection: "column", gap: 6, maxHeight: 220, overflowY: "auto" }}>
                        {availableDates
                          .filter(d => d.toISOString().split("T")[0] !== dateStr)
                          .map(d => {
                            const dKey = d.toISOString().split("T")[0];
                            const isSelected = dec === `date:${dKey}`;
                            // Рахуємо скільки вільних слотів у цей день
                            const freeSlotsCount = BREAKS.filter(br => {
                              const sk = `${dKey}_${br.id}`;
                              const slot = slots[sk];
                              if (!slot) return true;
                              const sum = (slot.infected || []).reduce((s, i) => s + (i.power || 1), 0);
                              return sum < 3 && !slot.infected?.some(i => i.uid === debtor.uid);
                            }).length;

                            return (
                              <div
                                key={dKey}
                                onClick={() => { setDecision(decKey, `date:${dKey}`); setPickingDate(null); }}
                                style={{
                                  padding: "10px 14px", borderRadius: 10, cursor: freeSlotsCount > 0 ? "pointer" : "not-allowed",
                                  border: "2px solid", borderColor: isSelected ? "#276749" : "var(--border)",
                                  background: isSelected ? "#F0FFF4" : freeSlotsCount === 0 ? "#F7FAFC" : "white",
                                  opacity: freeSlotsCount === 0 ? 0.5 : 1,
                                  display: "flex", justifyContent: "space-between", alignItems: "center"
                                }}
                              >
                                <div>
                                  <div style={{ fontSize: 13, fontWeight: 700 }}>
                                    {DAY_NAMES[d.getDay()]}, {formatShortDate(d)}
                                  </div>
                                  <div style={{ fontSize: 11, color: "var(--text2)" }}>
                                    {freeSlotsCount > 0 ? `${freeSlotsCount} вільних перерв` : "Немає місця"}
                                  </div>
                                </div>
                                {isSelected && <span style={{ color: "#276749", fontSize: 16 }}>✓</span>}
                                {freeSlotsCount === 0 && <span style={{ fontSize: 11, color: "#A0AEC0" }}>🚫</span>}
                              </div>
                            );
                          })}
                      </div>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        ))}

        <button className="btn-primary" style={{ marginTop: 8 }} onClick={() => onConfirm(decisions)}>
          ⚡ Застосувати оптимізацію
        </button>
        <button className="btn-secondary" onClick={onClose}>Скасувати</button>
      </div>
    </div>
  );
}

  function AdminScheduleTab({ allUsers }) {
    const [gameData, setGameData] = useState(null);
    const [loading, setLoading] = useState(true);
    const [saving, setSaving] = useState(false);
    const [view, setView] = useState("schedule");
    const [selectedSlot, setSelectedSlot] = useState(null);
    const [showSlotModal, setShowSlotModal] = useState(false);
    const [showPlayerModal, setShowPlayerModal] = useState(false);
    const [selectedPlayer, setSelectedPlayer] = useState(null);
    const [showPenaltyModal, setShowPenaltyModal] = useState(false);
    const [penaltyType, setPenaltyType] = useState("fine");
    const [penaltyReason, setPenaltyReason] = useState("");
    const [penaltyValue, setPenaltyValue] = useState(1);
    const [weekOffset, setWeekOffset] = useState(0);
    const [showOptimizeModal, setShowOptimizeModal] = useState(false);


    useEffect(() => {
      const unsub = window._fb.onSnapshot(
        window._fb.doc(window._fbDb, "gameSchedule", "main"),
        snap => { setGameData(snap.exists() ? snap.data() : { slots:{}, players:[], penalties:[], generatedAt:null }); setLoading(false); },
        err => { console.error(err); setLoading(false); }
      );
      return unsub;
    }, []);

    const players = useMemo(() => {
      const base = gameData?.players || [];
      return base.map(p => {
        const u = allUsers.find(u => u.uid === p.uid);
        return { ...p, firstName: u?.firstName || p.firstName || "?", lastName: u?.lastName || p.lastName || "", photoUrl: u?.photoUrl || p.photoUrl || "" };
      });
    }, [gameData, allUsers]);

    const slots = gameData?.slots || {};
    const penalties = gameData?.penalties || [];

    const allDates = generateScheduleDates();
    const week1 = allDates.slice(0, 5);
    const week2 = allDates.slice(5, 10);
    const currentWeekDates = weekOffset === 0 ? week1 : week2;

    const playerStats = useMemo(() => {
      const stats = {};
      players.forEach(p => { stats[p.uid] = { turns: 0, dayOffs: 0 }; });
      Object.values(slots).forEach(slot => {
        slot?.infected?.forEach(inf => { if (stats[inf.uid]) stats[inf.uid].turns++; });
        slot?.dayOff?.forEach(uid => { if (stats[uid]) stats[uid].dayOffs++; });
      });
      penalties.forEach(pen => {
        if (!stats[pen.uid]) return;
        if (pen.type === "fine") stats[pen.uid].turns += (pen.value || 0);
        if (pen.type === "dayoff") stats[pen.uid].dayOffs += (pen.value || 0);
      });
      return stats;
    }, [players, slots, penalties]);

    const maxTurns = Math.max(1, ...Object.values(playerStats).map(s => s.turns));

    async function saveData(newData) {
      setSaving(true);
      try { await window._fb.setDoc(window._fb.doc(window._fbDb, "gameSchedule", "main"), newData); }
      catch(e) { alert("Помилка збереження: " + e.message); }
      setSaving(false);
    }

    async function handleAutoGenerate() {
      if (!window.confirm("Автоматично згенерувати розклад на 2 тижні? Існуючі слоти залишаться.")) return;
      const playersForGen = players.map(p => ({ uid: p.uid, firstName: p.firstName, lastName: p.lastName, power: p.power || 1, bannedFromGame: p.bannedFromGame || false }));
      const newSlots = autoGenerateSchedule(playersForGen, slots);
      await saveData({ ...gameData, slots: newSlots, generatedAt: new Date().toISOString() });
    }

    async function handleOptimize() {
      // Рахуємо боржників для підтвердження
      const debtCount = {};
      players.forEach(p => { debtCount[p.uid] = 0; });
      Object.values(slots).forEach(slot => {
        slot?.dayOff?.forEach(uid => { if (debtCount[uid] !== undefined) debtCount[uid]++; });
      });
      const debtors = players.filter(p => debtCount[p.uid] > 0);
      if (debtors.length === 0) {
        alert("Боржників немає — всі відпрацювали свої зміни!");
        return;
      }
      const debtorNames = debtors.map(p => `${p.firstName} ${p.lastName||""} (${debtCount[p.uid]} прогул${debtCount[p.uid] > 1 ? "и" : ""})`).join("\n");
      if (!window.confirm(`Оптимізувати графік для боржників?\n\n${debtorNames}\n\nВони замінять тих хто грав найбільше. Інші слоти не зміняться.`)) return;

      const playersForOpt = players.map(p => ({ uid: p.uid, firstName: p.firstName, lastName: p.lastName || "", power: p.power || 1, bannedFromGame: p.bannedFromGame || false }));
      const newSlots = optimizeSchedule(playersForOpt, slots, penalties);
      await saveData({ ...gameData, slots: newSlots, optimizedAt: new Date().toISOString() });
    }

    async function handleClearSchedule() {
      if (!window.confirm("Очистити весь розклад? Гравці залишаться.")) return;
      await saveData({ ...gameData, slots: {} });
    }

    async function addPlayerToGame(user) {
      const already = players.find(p => p.uid === user.uid);
      if (already) return alert("Гравець вже є у грі");
      const newPlayers = [...players, { uid: user.uid, firstName: user.firstName, lastName: user.lastName, photoUrl: user.photoUrl || "", power: 1, bannedFromGame: false, dayOffs: 0 }];
      await saveData({ ...gameData, players: newPlayers });
    }

    async function updatePlayer(uid, upd) {
      const newPlayers = players.map(p => p.uid === uid ? { ...p, ...upd } : p);
      await saveData({ ...gameData, players: newPlayers });
      setSelectedPlayer(prev => prev && prev.uid === uid ? { ...prev, ...upd } : prev);
    }

    async function removePlayerFromGame(uid) {
      if (!window.confirm("Видалити гравця з графіку гри?")) return;
      const newPlayers = players.filter(p => p.uid !== uid);
      const newSlots = {};
      Object.entries(slots).forEach(([k, v]) => {
        newSlots[k] = { ...v, infected: (v.infected||[]).filter(i=>i.uid!==uid), dayOff: (v.dayOff||[]).filter(id=>id!==uid) };
      });
      await saveData({ ...gameData, players: newPlayers, slots: newSlots });
      setSelectedPlayer(null);
    }

    async function giveSlotDayOff(slotKey, uid) {
      const slot = slots[slotKey] || { infected: [], dayOff: [] };
      const newSlots = { ...slots, [slotKey]: { ...slot, infected: (slot.infected||[]).filter(i=>i.uid!==uid), dayOff: [...new Set([...(slot.dayOff||[]), uid])] } };
      await saveData({ ...gameData, slots: newSlots });
    }

    async function cancelSlotDayOff(slotKey, uid) {
      const slot = slots[slotKey] || { infected: [], dayOff: [] };
      const newSlots = { ...slots, [slotKey]: { ...slot, dayOff: (slot.dayOff||[]).filter(id=>id!==uid) } };
      await saveData({ ...gameData, slots: newSlots });
    }

    async function addPenalty() {
      if (!penaltyReason) return alert("Вкажіть причину");
      const newPenalties = [...penalties, { uid: selectedPlayer.uid, name: `${selectedPlayer.firstName} ${selectedPlayer.lastName}`.trim(), type: penaltyType, reason: penaltyReason, value: penaltyValue, createdAt: new Date().toISOString() }];
      await saveData({ ...gameData, penalties: newPenalties });
      setShowPenaltyModal(false); setPenaltyReason(""); setPenaltyValue(1);

    async function handleSlotSave(slotKey, newInfected) {

          {[["schedule","📅 Розклад"],["players","👥 Гравці"],["stats","📊 Статистика"]].map(([k,v]) => (
            <button key={k} onClick={() => setView(k)} style={{padding:"8px 14px",border:"none",borderRadius:"8px 8px 0 0",background:view===k?"var(--accent)":"transparent",color:view===k?"white":"var(--text2)",fontWeight:700,fontSize:12,cursor:"pointer",fontFamily:"'Raleway',sans-serif"}}>{v}</button>
          ))}

        </div>

                <button className="btn-optimize" onClick={handleOptimize}>⚡ Оптимізувати</button>
                <button className="btn-danger" style={{flex:1,fontSize:12,minWidth:80}} onClick={handleClearSchedule}>🗑 Очистити</button>
              </div>
              {gameData?.optimizedAt && <div style={{fontSize:11,color:"var(--success)",marginBottom:4}}>⚡ Оптимізовано: {new Date(gameData.optimizedAt).toLocaleDateString("uk-UA")}</div>}
              {gameData?.generatedAt && <div style={{fontSize:11,color:"var(--text2)",marginBottom:12}}>📅 Згенеровано: {new Date(gameData.generatedAt).toLocaleDateString("uk-UA")}</div>}
              <div className="week-tabs">

                <button className="btn-danger" style={{background:"#744210"}} onClick={() => removePlayerFromGame(selectedPlayer.uid)}>🗑 Видалити з графіку</button>
                <button className="btn-secondary" onClick={() => setSelectedPlayer(null)}>Закрити</button>

        {showPenaltyModal && selectedPlayer && (

            <div className="modal-sheet">
              <div className="modal-handle" />

              <div style={{display:"flex",gap:8,marginBottom:16}}>
                <button className={`power-btn p3${penaltyType==="fine"?" sel":""}`} style={{borderColor:penaltyType==="fine"?"#C53030":"var(--border)"}} onClick={() => setPenaltyType("fine")}>⚡ Штраф</button>
                <button className={`power-btn p1${penaltyType==="dayoff"?" sel":""}`} style={{borderColor:penaltyType==="dayoff"?"#276749":"var(--border)"}} onClick={() => setPenaltyType("dayoff")}>🌙 Отгул</button>

        )}

{showOptimizeModal && (
  <OptimizeModal
    players={players}
    slots={slots}
    onConfirm={applyOptimize}
    onClose={() => setShowOptimizeModal(false)}
  />
)}
     
 </div>
    );

  function SlotEditModal({ slot, players, onSave, onDayOff, onCancelDayOff, onClose }) {
    const { slotKey, date, br } = slot;
    const existingSlot = slot.slot || { infected: [], dayOff: [] };
    const [infected, setInfected] = useState(existingSlot.infected || []);
    const totalPower = infected.reduce((s, i) => s + (i.power || 1), 0);

    function togglePlayer(p) {
      const existing = infected.find(i => i.uid === p.uid);
      if (existing) setInfected(infected.filter(i => i.uid !== p.uid));
      else setInfected([...infected, { uid: p.uid, name: `${p.firstName} ${p.lastName||""}`.trim(), power: p.power || 1 }]);
    }

    return (
      <div className="modal-backdrop" onClick={e => e.target===e.currentTarget && onClose()}>
        <div className="modal-sheet">
          <div className="modal-handle" />
          <div className="modal-title">✏️ {br.label} — {formatShortDate(date)}</div>
          <div style={{fontSize:13,color:"var(--text2)",marginBottom:16}}>{br.duration} хвилин · Загальна сила: <b style={{color:totalPower===3?"var(--success)":totalPower>3?"var(--danger)":"var(--text)"}}>{totalPower}/3</b></div>
          <div className="input-label" style={{marginBottom:8}}>Оберіть заражених (сума сил = 3)</div>
          <div className="player-select-list">
            {players.filter(p => !p.bannedFromGame).map(p => {
              const isSelected = infected.some(i => i.uid === p.uid);
              const isDayOff = existingSlot.dayOff?.includes(p.uid);
              return (
                <div key={p.uid} className={`player-select-item${isSelected?" selected":""}${isDayOff?" banned-from-game":""}`} onClick={() => !isDayOff && togglePlayer(p)}>
                  <div className={`psi-check${isSelected?" checked":""}`}>{isSelected?"✓":""}</div>
                  <div className="user-mini-photo" style={{width:32,height:32}}>{p.photoUrl?<img src={p.photoUrl} alt=""/>:<span style={{fontSize:14}}>{p.firstName?.[0]||"?"}</span>}</div>
                  <div style={{flex:1}}>
                    <div style={{fontSize:13,fontWeight:700}}>{p.firstName} {p.lastName}</div>
                    <div style={{fontSize:11,color:"var(--text2)"}}>⚡ Сила {p.power||1}{isDayOff?" · 🌙 отгул":""}</div>
                  </div>
                  {isSelected && <div className={`infected-chip p${p.power||1}`}>×{p.power||1}</div>}
                </div>
              );
            })}
          </div>
          {infected.length > 0 && (
            <div style={{marginBottom:16}}>
              <div className="input-label" style={{marginBottom:8}}>Видати отгул (знімає зі слоту)</div>
              {infected.map(inf => (
                <div key={inf.uid} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"6px 0",borderBottom:"1px solid var(--bg2)"}}>
                  <div style={{fontSize:13}}>🧟 {inf.name}</div>
                  <button className="btn-outline" style={{padding:"4px 10px",fontSize:11}} onClick={() => { onDayOff(slotKey, inf.uid); onClose(); }}>🌙 Отгул</button>
                </div>
              ))}
            </div>
          )}
          {existingSlot.dayOff?.length > 0 && (
            <div style={{marginBottom:16}}>
              <div className="input-label" style={{marginBottom:8}}>Скасувати отгул</div>
              {existingSlot.dayOff.map(uid => {
                const p = players.find(p => p.uid === uid);
                return p ? (
                  <div key={uid} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"6px 0"}}>
                    <div style={{fontSize:13}}>🌙 {p.firstName} {p.lastName}</div>
                    <button className="btn-danger" style={{padding:"4px 10px",fontSize:11}} onClick={() => { onCancelDayOff(slotKey, uid); onClose(); }}>✕</button>
                  </div>
                ) : null;
              })}
            </div>
          )}
          <button className="btn-primary" onClick={() => onSave(slotKey, infected)}>💾 Зберегти</button>
          <button className="btn-secondary" onClick={onClose}>Скасувати</button>
        </div>
      </div>
    );
  }

  function AddPlayerModal({ allUsers, existingPlayers, onAdd, onClose }) {
    const [search, setSearch] = useState("");
    const available = allUsers.filter(u => {
      const notIn = !existingPlayers.find(p => p.uid === u.uid);
      const matchSearch = !search || `${u.firstName} ${u.lastName} ${u.email}`.toLowerCase().includes(search.toLowerCase());
      return notIn && matchSearch && !u.banned;
    });
    return (
      <div className="modal-backdrop" onClick={e => e.target===e.currentTarget && onClose()}>
        <div className="modal-sheet">
          <div className="modal-handle" />
          <div className="modal-title">👥 Додати гравця</div>
          <div className="input-group"><input className="input-field" value={search} onChange={e => setSearch(e.target.value)} placeholder="Пошук за ім'ям..." /></div>
          <div className="player-select-list">
            {available.length===0 && <div style={{padding:20,textAlign:"center",color:"var(--text2)",fontSize:13}}>Немає доступних гравців</div>}
            {available.map(u => (
              <div key={u.uid} className="player-select-item" onClick={() => { onAdd(u); onClose(); }}>
                <div className="user-mini-photo" style={{width:36,height:36}}>{u.photoUrl?<img src={u.photoUrl} alt=""/>:<span style={{fontSize:14}}>{u.firstName?.[0]||"?"}</span>}</div>
                <div><div style={{fontSize:13,fontWeight:700}}>{u.firstName} {u.lastName}</div><div style={{fontSize:11,color:"var(--text2)"}}>{u.grade} · {u.email}</div></div>
              </div>
            ))}
          </div>
          <button className="btn-secondary" onClick={onClose}>Скасувати</button>
        </div>
      </div>
    );
  }

  // ── AdminPanel ──
  function AdminPanel({ adminProfile }) {
    const [activeAdminTab, setActiveAdminTab] = useState("users");
    const [users, setUsers] = useState([]);
    const [courtCases, setCourtCases] = useState([]);
    const [loading, setLoading] = useState(true);
    const [selectedUser, setSelectedUser] = useState(null);
    const [editMode, setEditMode] = useState(false);
    const [editData, setEditData] = useState({});
    const [editPhotoUrl, setEditPhotoUrl] = useState("");
    const [showReportModal, setShowReportModal] = useState(false);
    const [reportTarget, setReportTarget] = useState(null);
    const [reportTitle, setReportTitle] = useState("");
    const [reportBody, setReportBody] = useState("");
    const [reportType, setReportType] = useState("Повідомлення");
    const [caseNote, setCaseNote] = useState("");
    const [selectedCase, setSelectedCase] = useState(null);
    const [showCourtModal, setShowCourtModal] = useState(false);
    const [newDefendantName, setNewDefendantName] = useState("");
    const [newCrimeType, setNewCrimeType] = useState("");
    const [newDescription, setNewDescription] = useState("");
    const [submittingCourt, setSubmittingCourt] = useState(false);
    const editPhotoRef = useRef();

    useEffect(() => {
      const db = window._fbDb;
      const { collection, query, orderBy, onSnapshot, where } = window._fb;

      const qUsers = query(collection(db, "users"), orderBy("createdAt", "desc"));
      const unsubUsers = onSnapshot(qUsers,
        snap => { setUsers(snap.docs.map(d => ({ id: d.id, ...d.data() }))); setLoading(false); },
        err => {
          window._fb.onSnapshot(collection(db, "users"), snap2 => {
            setUsers(snap2.docs.map(d => ({ id: d.id, ...d.data() })));
            setLoading(false);
          });
        }
      );

      const qCourt = query(collection(db, "court"), orderBy("createdAt", "desc"));
      const unsubCourt = onSnapshot(qCourt,
        snap => { setCourtCases(snap.docs.map(d => ({ id: d.id, ...d.data() }))); },
        err => {
          window._fb.onSnapshot(collection(db, "court"), snap2 => {
            let docs = snap2.docs.map(d => ({ id: d.id, ...d.data() }));
            docs.sort((a,b) => ((b.createdAt?.seconds||0) - (a.createdAt?.seconds||0)));
            setCourtCases(docs);
          });
        }
      );

      return () => { unsubUsers(); unsubCourt(); };
    }, []);

    async function toggleBan(user) {
      await window._fb.updateDoc(window._fb.doc(window._fbDb,"users",user.uid), {banned:!user.banned});
    }
    async function saveEdit() {
      const update = {...editData};
      if (editPhotoUrl) update.photoUrl = editPhotoUrl;
      await window._fb.updateDoc(window._fb.doc(window._fbDb,"users",selectedUser.uid), update);
      setEditMode(false); setSelectedUser({...selectedUser,...update}); setEditPhotoUrl("");
    }
    async function sendReport() {
      if (!reportTitle || !reportBody) return alert("Заповніть поля");
      await window._fb.addDoc(window._fb.collection(window._fbDb,"reports"), {
        userId:reportTarget.uid, title:reportTitle, body:reportBody,
        type:reportType, read:false, createdAt:window._fb.serverTimestamp()
      });
      setShowReportModal(false); setReportTitle(""); setReportBody("");
    }
    async function resolveCase(caseId, status) {
      await window._fb.updateDoc(window._fb.doc(window._fbDb,"court",caseId), {status, adminNote:caseNote});
      setSelectedCase(null); setCaseNote("");
    }
    async function submitAdminCase() {
      if (!newDefendantName || !newCrimeType || !newDescription) return alert("Заповніть всі поля");
      setSubmittingCourt(true);
      try {
        await window._fb.addDoc(window._fb.collection(window._fbDb,"court"), {
          plaintiffId:"admin", plaintiffName:"Суддя", accused:newDefendantName,
          crimeType:newCrimeType, description:newDescription, status:"pending", createdAt:window._fb.serverTimestamp()
        });
        setShowCourtModal(false); setNewDefendantName(""); setNewCrimeType(""); setNewDescription("");
      } catch(e) { alert("Помилка: " + e.message); }
      setSubmittingCourt(false);
    }
    async function handleEditPhoto(e) {
      const file = e.target.files[0]; if (!file) return;
      if (file.size > 5 * 1024 * 1024) { alert("Фото занадто велике. Максимум 5 МБ."); return; }
      const reader = new FileReader();
      reader.onload = ev => setEditPhotoUrl(ev.target.result);
      reader.readAsDataURL(file);
      try {
        const formData = new FormData();
        formData.append("file", file);
        formData.append("upload_preset", "nikus_photos");
        formData.append("public_id", `${selectedUser.uid}_${Date.now()}`);
        const res = await fetch("https://api.cloudinary.com/v1_1/dvzpkxoxv/image/upload", { method: "POST", body: formData });
        const data = await res.json();
        if (!data.secure_url) throw new Error("Cloudinary не повернув URL");
        setEditPhotoUrl(data.secure_url);
      } catch(err) { alert("Помилка завантаження фото: " + err.message); }
    }

    const GRADES = ["5 клас","6 клас","7 клас","8 клас","9 клас"];

    if (loading) return <div style={{display:"flex",justifyContent:"center",alignItems:"center",height:"100vh"}}><div className="spinner"/></div>;

    return (
      <div style={{background:"var(--bg)",minHeight:"100vh"}}>
        <div className="header">
          <div className="header-logo">НД</div>
          <div><div className="header-title">НікусДія</div><div className="header-sub">Панель судді</div></div>
          <span className="admin-badge" style={{marginLeft:"auto"}}>⚖️ СУДДЯ</span>
          <button className="header-logout" style={{marginLeft:10}} onClick={() => window._fb.signOut(window._fbAuth)}>Вийти</button>
        </div>
        <div style={{display:"flex",borderBottom:"2px solid var(--border)",background:"white",overflowX:"auto"}}>
          {[["users","👥 Учні"],["court","⚖️ Суд"],["schedule","🧟 Гра"]].map(([k,v]) => (
            <button key={k} onClick={() => setActiveAdminTab(k)} style={{flex:1,padding:"14px 8px",border:"none",background:"transparent",fontFamily:"'Raleway',sans-serif",fontWeight:700,fontSize:12,cursor:"pointer",color:activeAdminTab===k?"var(--accent)":"var(--text2)",borderBottom:activeAdminTab===k?"3px solid var(--accent)":"3px solid transparent",transition:"all 0.2s",whiteSpace:"nowrap"}}>{v}</button>
          ))}
        </div>

        {activeAdminTab === "schedule" && <AdminScheduleTab allUsers={users} />}

        {activeAdminTab !== "schedule" && (
          <div className="page-content" style={{paddingBottom:40}}>
            {activeAdminTab === "users" && (
              <>
                <div className="section-title">👥 Всі учні ({users.length})</div>
                {users.map(u => (
                  <div key={u.uid||u.id} className="admin-user-card" onClick={() => { setSelectedUser(u); setEditData({firstName:u.firstName||"",lastName:u.lastName||"",grade:u.grade||"",contact:u.contact||""}); setEditPhotoUrl(""); }}>
                    <div className="user-mini-photo">{u.photoUrl?<img src={u.photoUrl} alt=""/>:<span>{(u.firstName?.[0]||"")+(u.lastName?.[0]||"")}</span>}</div>
                    <div style={{flex:1}}>
                      <div style={{fontWeight:700,fontSize:14}}>{u.firstName} {u.lastName}</div>
                      <div style={{fontSize:12,color:"var(--text2)"}}>{u.grade} · {u.email}</div>
                    </div>
                    {u.banned && <span style={{fontSize:11,color:"var(--danger)",fontWeight:700}}>БАН</span>}
                  </div>
                ))}
              </>
            )}
            {activeAdminTab === "court" && (
              <>
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
                  <div className="section-title" style={{marginBottom:0}}>⚖️ Судові справи ({courtCases.length})</div>
                  <button className="btn-primary" style={{width:"auto",padding:"9px 16px",fontSize:13}} onClick={() => setShowCourtModal(true)}>+ Нова справа</button>
                </div>
                {courtCases.length===0 ? (
                  <div className="empty-state"><div className="empty-state-icon">⚖️</div><div className="empty-state-text">Справ поки немає</div></div>
                ) : courtCases.map(c => (
                  <div key={c.id} className="court-card">
                    <div className={`court-status ${c.status}`}>{c.status==="pending"?"🔵 Розглядається":c.status==="approved"?"✅ Підтримано":"❌ Відхилено"}</div>
                    <div className="court-title">Позивач: {c.plaintiffName}</div>
                    <div className="court-sub">Проти: <b>{c.accused}</b></div>
                    <div className="court-sub">{c.crimeType}</div>
                    <div className="court-sub" style={{fontSize:12}}>{c.description}</div>
                    <div className="court-meta">{formatDate(c.createdAt)}</div>
                    {c.status==="pending" && (
                      <div style={{marginTop:10}}>
                        <textarea className="textarea-field" style={{minHeight:60,fontSize:13}} placeholder="Коментар судді..." value={selectedCase===c.id?caseNote:""} onChange={e => { setSelectedCase(c.id); setCaseNote(e.target.value); }} onClick={() => setSelectedCase(c.id)} />
                        <div className="court-admin-btns">
                          <button className="btn-success" onClick={() => resolveCase(c.id,"approved")}>✅ Підтримати</button>
                          <button className="btn-danger" onClick={() => resolveCase(c.id,"rejected")}>❌ Відхилити</button>
                        </div>
                      </div>
                    )}
                    {c.adminNote && <div style={{marginTop:8,padding:"8px 12px",background:"var(--bg2)",borderRadius:8,fontSize:13}}>💬 {c.adminNote}</div>}
                  </div>
                ))}
              </>
            )}
          </div>
        )}

        {showCourtModal && (
          <div className="modal-backdrop" onClick={e => e.target===e.currentTarget && setShowCourtModal(false)}>
            <div className="modal-sheet">
              <div className="modal-handle" />
              <div className="modal-title">⚖️ Нова справа (від судді)</div>
              <div className="input-group"><div className="input-label">Звинувачений</div><input className="input-field" value={newDefendantName} onChange={e => setNewDefendantName(e.target.value)} placeholder="Ім'я / нікнейм" /></div>
              <div className="input-group">
                <div className="input-label">Тип порушення</div>
                <select className="select-field" value={newCrimeType} onChange={e => setNewCrimeType(e.target.value)}>
                  <option value="">Оберіть тип</option>
                  {["Порушення правил гри","Образа / цькування","Шахрайство","Крадіжка","Спам","Інше"].map(o => <option key={o}>{o}</option>)}
                </select>
              </div>
              <div className="input-group"><div className="input-label">Опис</div><textarea className="textarea-field" value={newDescription} onChange={e => setNewDescription(e.target.value)} placeholder="Деталі справи..." /></div>
              <button className="btn-primary" onClick={submitAdminCase} disabled={submittingCourt}>{submittingCourt?"Надсилання…":"Відкрити справу"}</button>
              <button className="btn-secondary" onClick={() => setShowCourtModal(false)}>Скасувати</button>
            </div>
          </div>
        )}

        {selectedUser && (
          <div className="modal-backdrop" onClick={e => e.target===e.currentTarget && setSelectedUser(null)}>
            <div className="modal-sheet">
              <div className="modal-handle" />
              <IDCard profile={editPhotoUrl ? {...selectedUser,photoUrl:editPhotoUrl} : selectedUser} isAdmin={false} />
              {editMode ? (
                <>
                  <div className="input-group">
                    <div className="input-label">Фото</div>
                    <div style={{display:"flex",alignItems:"center",gap:12}}>
                      <div style={{width:56,height:56,borderRadius:"50%",overflow:"hidden",border:"2px solid var(--border)",flexShrink:0,background:"var(--bg2)",display:"flex",alignItems:"center",justifyContent:"center"}}>
                        {editPhotoUrl?<img src={editPhotoUrl} style={{width:"100%",height:"100%",objectFit:"cover"}} alt=""/>:selectedUser.photoUrl?<img src={selectedUser.photoUrl} style={{width:"100%",height:"100%",objectFit:"cover"}} alt=""/>:<span style={{fontSize:22}}>👤</span>}
                      </div>
                      <button className="btn-outline" style={{flex:1}} onClick={() => editPhotoRef.current.click()}>📷 Змінити фото</button>
                      <input ref={editPhotoRef} type="file" accept="image/*" style={{display:"none"}} onChange={handleEditPhoto} />
                    </div>
                  </div>
                  {[["Ім'я","firstName"],["Прізвище","lastName"],["Контакт","contact"]].map(([l,k]) => (
                    <div key={k} className="input-group"><div className="input-label">{l}</div><input className="input-field" value={editData[k]} onChange={e => setEditData({...editData,[k]:e.target.value})} /></div>
                  ))}
                  <div className="input-group">
                    <div className="input-label">Клас</div>
                    <select className="select-field" value={editData.grade} onChange={e => setEditData({...editData,grade:e.target.value})}>
                      <option value="">Оберіть клас</option>
                      {GRADES.map(g => <option key={g} value={g}>{g}</option>)}
                    </select>
                  </div>
                  <button className="btn-primary" onClick={saveEdit}>💾 Зберегти</button>
                  <button className="btn-secondary" onClick={() => { setEditMode(false); setEditPhotoUrl(""); }}>Скасувати</button>
                </>
              ) : (
                <div style={{display:"flex",flexDirection:"column",gap:10,marginTop:8}}>
                  <button className="btn-outline" onClick={() => setEditMode(true)}>✏️ Редагувати дані</button>
                  <button className={selectedUser.banned?"btn-success":"btn-danger"} onClick={() => { toggleBan(selectedUser); setSelectedUser({...selectedUser,banned:!selectedUser.banned}); }}>{selectedUser.banned?"✅ Розблокувати":"⛔ Заблокувати"}</button>
                  <button className="btn-outline" onClick={() => { setReportTarget(selectedUser); setShowReportModal(true); }}>📢 Надіслати повідомлення</button>
                  <button className="btn-secondary" onClick={() => setSelectedUser(null)}>Закрити</button>
                </div>
              )}
            </div>
          </div>
        )}

        {showReportModal && (
          <div className="modal-backdrop" onClick={e => e.target===e.currentTarget && setShowReportModal(false)}>
            <div className="modal-sheet">
              <div className="modal-handle" />
              <div className="modal-title">📢 Повідомлення для {reportTarget?.firstName}</div>
              <div className="input-group">
                <div className="input-label">Тип</div>
                <select className="select-field" value={reportType} onChange={e => setReportType(e.target.value)}>
                  {["Повідомлення","Попередження","Звіт","Рішення суду"].map(o => <option key={o}>{o}</option>)}
                </select>
              </div>
              <div className="input-group"><div className="input-label">Заголовок</div><input className="input-field" value={reportTitle} onChange={e => setReportTitle(e.target.value)} placeholder="Заголовок повідомлення" /></div>
              <div className="input-group"><div className="input-label">Текст</div><textarea className="textarea-field" value={reportBody} onChange={e => setReportBody(e.target.value)} placeholder="Текст повідомлення..." /></div>
              <button className="btn-primary" onClick={sendReport}>Надіслати</button>
              <button className="btn-secondary" onClick={() => setShowReportModal(false)}>Скасувати</button>
            </div>
          </div>
        )}
      </div>
    );
  }

  // ── NikusDiya ──
  function NikusDiya() {
    const [ready, setReady] = useState(false);
    const [user, setUser] = useState(null);
    const [profile, setProfile] = useState(null);
    const [loadingAuth, setLoadingAuth] = useState(true);
    const [tab, setTab] = useState("cabinet");
    const [unreadReports, setUnreadReports] = useState(0);

    useEffect(() => { waitForFb().then(() => setReady(true)); }, []);

    useEffect(() => {
      if (!ready) return;
      const unsub = window._fb.onAuthStateChanged(window._fbAuth, async u => {
        console.log("AUTH STATE:", u?.email);
        setUser(u);
        if (u) {
          try {
            const snap = await window._fb.getDoc(window._fb.doc(window._fbDb,"users",u.uid));
            console.log("PROFILE EXISTS:", snap.exists(), snap.data());
            setProfile(snap.exists() ? snap.data() : null);
          } catch(e) {
            console.error("GETDOC ERROR:", e);
            setProfile(null);
          }
        } else { setProfile(null); }
        setLoadingAuth(false);
      });
      return unsub;
    }, [ready]);

    useEffect(() => {
      if (!ready || !user || !profile) return;
      const { collection, query, where, onSnapshot } = window._fb;
      const q = query(collection(window._fbDb,"reports"), where("userId","==",user.uid), where("read","==",false));
      const unsub = onSnapshot(q, snap => setUnreadReports(snap.size), err => console.error("unread badge:", err));
      return unsub;
    }, [ready, user, profile]);

    if (!ready || loadingAuth) return <div style={{display:"flex",justifyContent:"center",alignItems:"center",height:"100vh"}}><div className="spinner"/></div>;
    if (!user) return <AuthPage />;

    const isAdmin = user.email === ADMIN_EMAIL;
    if (isAdmin) return <AdminPanel adminProfile={profile || {uid:user.uid,email:user.email}} />;
    if (!profile) return <ProfileSetup user={user} onDone={async () => {
      const snap = await window._fb.getDoc(window._fb.doc(window._fbDb,"users",user.uid));
      if (snap.exists()) setProfile(snap.data());
    }} />;

    if (profile.banned) return (
      <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",minHeight:"100vh",padding:32,background:"var(--bg)",gap:16}}>
        <div style={{fontSize:64}}>⛔</div>
        <div style={{fontFamily:"'Unbounded',sans-serif",fontSize:20,fontWeight:800,color:"var(--danger)",textAlign:"center"}}>Акаунт заблоковано</div>
        <div style={{fontSize:14,color:"var(--text2)",textAlign:"center"}}>Ваш акаунт було заблоковано суддею НікусДії.</div>
        <button className="btn-secondary" style={{width:"auto",padding:"12px 24px"}} onClick={() => window._fb.signOut(window._fbAuth)}>Вийти</button>
      </div>
    );

    const navItems = [
      {key:"cabinet", icon:"🪪", label:"Кабінет"},
      {key:"reports", icon:"📢", label:"Звіти", badge:unreadReports},
      {key:"court",   icon:"⚖️", label:"Суд"},
      {key:"history", icon:"📜", label:"Історія"},
      {key:"charts",  icon:"🧟", label:"Гра"},
    ];

    return (
      <div className="app-wrap">
        <div className="header">
          <div className="header-logo">НД</div>
          <div><div className="header-title">НікусДія</div><div className="header-sub">Цифровий документ</div></div>
          <button className="header-logout" onClick={() => window._fb.signOut(window._fbAuth)}>Вийти</button>
        </div>
        {tab==="cabinet" && <CabinetTab profile={profile} isAdmin={isAdmin} />}
        {tab==="reports" && <ReportsTab userId={user.uid} />}
        {tab==="court"   && <CourtTab userId={user.uid} profile={profile} />}
        {tab==="history" && <HistoryTab userId={user.uid} />}
        {tab==="charts"  && <ChartsTab userId={user.uid} profile={profile} />}
        <div className="bottom-nav">
          {navItems.map(n => (
            <button key={n.key} className={`nav-item${tab===n.key?" active":""}`} onClick={() => setTab(n.key)} style={{position:"relative"}}>
              <span className="nav-icon">{n.icon}</span>
              <span>{n.label}</span>
              {n.badge > 0 && <div className="notif-dot"/>}
            </button>
          ))}
        </div>
      </div>
    );
