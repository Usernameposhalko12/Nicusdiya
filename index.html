  <style>
    :root {
      --ua-blue: #005BBB; --ua-yellow: #FFD700; --ua-yellow-light: #FFF3B0;

    .header-logo { width: 38px; height: 38px; background: var(--ua-yellow); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-family: 'Unbounded', sans-serif; font-size: 13px; font-weight: 800; color: var(--ua-blue); letter-spacing: -0.5px; flex-shrink: 0; box-shadow: 0 2px 8px rgba(255,215,0,0.4); }
    .header-title { font-family: 'Unbounded', sans-serif; font-size: 17px; font-weight: 700; color: white; letter-spacing: -0.3px; }

    .header-logout { margin-left: auto; background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 7px 14px; border-radius: 8px; font-size: 13px; cursor: pointer; font-family: 'Raleway', sans-serif; font-weight: 600; transition: background 0.2s; white-space: nowrap; }
    .header-logout:hover { background: rgba(255,255,255,0.25); }

    .auth-title-big { font-family: 'Unbounded', sans-serif; font-size: 26px; font-weight: 800; color: white; letter-spacing: -1px; margin-bottom: 6px; position: relative; z-index: 1; }
    .auth-subtitle { font-size: 13px; color: rgba(255,255,255,0.65); margin-bottom: 32px; position: relative; z-index: 1; text-align: center; }
    .auth-card { background: white; border-radius: 24px; padding: 28px 24px; width: 100%; max-width: 380px; box-shadow: 0 24px 80px rgba(0,0,0,0.3); position: relative; z-index: 1; }

    .id-card-logo-img { width: 32px; height: 32px; border-radius: 6px; object-fit: cover; flex-shrink: 0; }
    .id-card-app-name { font-family: 'Unbounded', sans-serif; font-size: 13px; font-weight: 700; color: rgba(255,255,255,0.9); letter-spacing: 0.5px; }
    .id-card-doc-type { font-size: 10px; color: rgba(255,255,255,0.55); letter-spacing: 1px; text-transform: uppercase; margin-top: 1px; }
    .id-card-body { display: flex; gap: 18px; position: relative; z-index: 1; }

    .id-photo img { width: 100%; height: 100%; object-fit: cover; }

    .court-title { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
    .court-sub { font-size: 13px; color: var(--text2); line-height: 1.4; margin-bottom: 8px; }
    .court-meta { font-size: 11px; color: #A0AEC0; }

    .textarea-field { width: 100%; padding: 13px 16px; border: 2px solid var(--border); border-radius: var(--radius-sm); font-size: 14px; font-family: 'Raleway', sans-serif; color: var(--text); background: var(--bg); resize: vertical; min-height: 100px; outline: none; transition: border-color 0.2s; }
    .textarea-field:focus { border-color: var(--accent); background: white; }

    /* ── ГРАФІКИ: Гра Заражений ── */
    .game-header-banner {
      background: linear-gradient(135deg, #1a0a2e 0%, #2d1b69 50%, #11998e 100%);
      border-radius: 18px; padding: 20px; margin-bottom: 18px; position: relative; overflow: hidden;
    }

    .stat-card-label { font-size: 10px; color: var(--text2); font-weight: 600; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.5px; }

    .player-row:last-child { border-bottom: none; }

    const { useState, useEffect, useRef, useCallback, useMemo } = React;

    const ADMIN_EMAIL = "usernameposhalko6@gmail.com";

    // Перерви на день
    const BREAKS = [
      { id: 1, label: "1 перерва", after: 1, duration: 10 },
      { id: 2, label: "2 перерва", after: 2, duration: 30 },
      { id: 3, label: "3 перерва", after: 3, duration: 10 },
      { id: 4, label: "4 перерва", after: 4, duration: 10 },
      { id: 5, label: "5 перерва", after: 5, duration: 10 },
      { id: 6, label: "6 перерва", after: 6, duration: 10 },
    ];

    const WORKDAYS = [1,2,3,4,5]; // пн-пт
    const DAY_NAMES = ["","Пн","Вт","Ср","Чт","Пт","Сб","Нд"];
    const MONTH_NAMES_UK = ["січ","лют","бер","кві","тра","чер","лип","сер","вер","жов","лис","гру"];

    function formatDate(ts) {
      if (!ts) return "—";
      const d = ts.toDate ? ts.toDate() : new Date(ts);
      return d.toLocaleDateString("uk-UA", { day: "2-digit", month: "2-digit", year: "numeric" });
    }

    function formatShortDate(d) {
      return `${d.getDate()} ${MONTH_NAMES_UK[d.getMonth()]}`;
    }

    // Генерація дат на 2 тижні вперед (тільки Пн-Пт)
    function generateScheduleDates(from = new Date()) {
      const dates = [];
      const start = new Date(from);
      start.setHours(0,0,0,0);
      let d = new Date(start);
      // Починаємо з наступного понеділка, якщо сьогодні не Пн
      const dayOfWeek = d.getDay(); // 0=нд
      if (dayOfWeek === 0) d.setDate(d.getDate() + 1);
      else if (dayOfWeek === 6) d.setDate(d.getDate() + 2);

      // 2 тижні = 10 робочих днів
      while (dates.length < 10) {
        if (d.getDay() !== 0 && d.getDay() !== 6) {
          dates.push(new Date(d));
        }
        d.setDate(d.getDate() + 1);
      }
      return dates;
    }

    // Алгоритм автогенерації: рівномірно призначаємо заражених
    // turns[uid] = кількість разів зараженим
    // Для кожної перерви вибираємо 1-2 гравці з мінімальною кількістю призначень
    // totalPower = 3 (комбінація сил заражених)
    function autoGenerateSchedule(players, existingSlots = {}) {
      // players: [{uid, firstName, lastName, power, bannedFromGame}]
      const activePlayers = players.filter(p => !p.bannedFromGame);
      if (activePlayers.length < 2) return {};

      const turns = {};
      activePlayers.forEach(p => { turns[p.uid] = 0; });

      // Рахуємо вже існуючі призначення
      Object.values(existingSlots).forEach(slot => {
        if (slot && slot.infected) {
          slot.infected.forEach(inf => {
            if (turns[inf.uid] !== undefined) turns[inf.uid]++;
          });
        }
      });

      const newSlots = { ...existingSlots };
      const dates = generateScheduleDates();

      dates.forEach(date => {
        const dateKey = date.toISOString().split("T")[0];
        BREAKS.forEach(br => {
          const slotKey = `${dateKey}_${br.id}`;
          if (newSlots[slotKey]) return; // вже є

          // Вибираємо комбінацію заражених (загальна сила = 3)
          // Можливі комбінації: [3], [2,1], [1,2], [1,1,1]
          // Вибираємо гравців з найменшою кількістю turns
          const sorted = [...activePlayers].sort((a, b) => {
            const ta = turns[a.uid] || 0;
            const tb = turns[b.uid] || 0;
            return ta - tb;
          });

          let infected = [];
          // Намагаємось взяти 1 гравця з силою 3, або 2 з сумою 3
          // Спрощено: беремо 1-3 гравці, їх "сила" береться з profil або дефолт
          // Якщо у гравця power > 0, використовуємо його, інакше = 1
          const getP = p => (p.power && p.power >= 1 && p.power <= 3) ? p.power : 1;

          // Знаходимо комбінацію що дає суму 3
          let combo = null;
          // Спробуємо знайти 1 гравця з силою 3
          const p3 = sorted.find(p => getP(p) === 3);
          if (p3) { combo = [p3]; }
          else {
            // 1 з силою 2 + 1 з силою 1
            const p2 = sorted.find(p => getP(p) === 2);
            const p1 = sorted.find(p => getP(p) === 1 && (!p2 || p.uid !== p2.uid));
            if (p2 && p1) { combo = [p2, p1]; }
            else {
              // 3 з силою 1
              const threes = sorted.filter(p => getP(p) === 1).slice(0, 3);
              if (threes.length >= 2) combo = threes.slice(0, Math.min(3, threes.length));
              else combo = sorted.slice(0, 1); // fallback
            }
          }

          if (combo && combo.length > 0) {
            infected = combo.map(p => ({ uid: p.uid, name: `${p.firstName} ${p.lastName || ""}`.trim(), power: getP(p) }));
            combo.forEach(p => { turns[p.uid] = (turns[p.uid] || 0) + 1; });
          }

          newSlots[slotKey] = { infected, dayOff: [] };
        });
      });

      return newSlots;
    }

        setSubmitting(false);
      }
      const statusLabel = { pending:"🔵 Розглядається", approved:"✅ Підтримано", rejected:"❌ Відхилено" };
      if (loading) return <div className="spinner" />;
      return (
        <div className="page-content">
          <div className="section-title">⚖️ Мої справи</div>
          {cases.length === 0 ? (
            <div className="empty-state"><div className="empty-state-icon">⚖️</div><div className="empty-state-text">Ви ще не подавали заяв.</div></div>
          ) : cases.map(c => (
            <div key={c.id} className="court-card">
              <div className={`court-status ${c.status}`}>{statusLabel[c.status]}</div>
              <div className="court-title">Проти: {c.accused}</div>
              <div className="court-sub">{c.crimeType}</div>
              <div className="court-sub" style={{color:"var(--text2)"}}>{c.description}</div>
              <div className="court-meta">Подано: {formatDate(c.createdAt)}</div>
              {c.adminNote && <div style={{marginTop:10,padding:"8px 12px",background:"var(--bg2)",borderRadius:8,fontSize:13,color:"var(--text2)"}}>💬 Суддя: {c.adminNote}</div>}
            </div>
          ))}
          <button className="fab" onClick={() => setShowModal(true)}>+</button>
          {showModal && (
            <div className="modal-backdrop" onClick={e => e.target===e.currentTarget && setShowModal(false)}>
              <div className="modal-sheet">
                <div className="modal-handle" />
                <div className="modal-title">⚖️ Нова судова заява</div>
                <div className="input-group"><div className="input-label">Ім'я звинуваченого</div><input className="input-field" value={accused} onChange={e => setAccused(e.target.value)} placeholder="Ім'я та прізвище / нікнейм" /></div>
                <div className="input-group">
                  <div className="input-label">Тип порушення</div>
                  <select className="select-field" value={crimeType} onChange={e => setCrimeType(e.target.value)}>
                    <option value="">Оберіть тип</option>
                    {["Порушення правил гри","Образа / цькування","Шахрайство","Крадіжка","Спам","Інше"].map(o => <option key={o}>{o}</option>)}
                  </select>
                </div>
                <div className="input-group"><div className="input-label">Опис ситуації</div><textarea className="textarea-field" value={description} onChange={e => setDescription(e.target.value)} placeholder="Детально опишіть що сталося..." /></div>
                <button className="btn-primary" onClick={submitCase} disabled={submitting}>{submitting ? "Надсилання…" : "Подати заяву"}</button>
                <button className="btn-secondary" onClick={() => setShowModal(false)}>Скасувати</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ── HistoryTab ──
    function HistoryTab({ userId }) {
      const [items, setItems] = useState([]);
      const [loading, setLoading] = useState(true);
      const db = window._fbDb;
      useEffect(() => {
        const { collection, query, where, orderBy, onSnapshot } = window._fb;
        const q = query(collection(db,"court"), where("plaintiffId","==",userId), orderBy("createdAt","desc"));
        const unsub = onSnapshot(q, snap => { setItems(snap.docs.map(d=>({id:d.id,...d.data()}))); setLoading(false); },
          err => {
            const q2 = query(collection(db,"court"), where("plaintiffId","==",userId));
            onSnapshot(q2, snap2 => {
              let docs = snap2.docs.map(d=>({id:d.id,...d.data()}));
              docs.sort((a,b)=>{ const ta=a.createdAt?.toDate?..()||new Date(0); const tb=b.createdAt?.toDate?..()||new Date(0); return tb-ta; });
              setItems(docs); setLoading(false);
            });
          }
        );
        return unsub;
      }, [userId]);
      if (loading) return <div className="spinner" />;
      const statusColor = { pending:"#2B6CB0", approved:"#276749", rejected:"#C53030" };
      const statusLabel = { pending:"Розглядається", approved:"Підтримано", rejected:"Відхилено" };
      return (
        <div className="page-content">
          <div className="section-title">📜 Історія справ</div>
          {items.length === 0 ? (
            <div className="empty-state"><div className="empty-state-icon">📜</div><div className="empty-state-text">Справ поки немає.</div></div>
          ) : items.map(item => (
            <div key={item.id} className="history-card">
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                <div style={{fontSize:14,fontWeight:700}}>Проти: {item.accused}</div>
                <div style={{fontSize:12,fontWeight:700,color:statusColor[item.status]}}>{statusLabel[item.status]}</div>
              </div>
              <div style={{fontSize:13,color:"var(--text2)",marginBottom:4}}>{item.crimeType}</div>
              <div style={{fontSize:11,color:"#A0AEC0"}}>{formatDate(item.createdAt)}</div>
              {item.adminNote && <div style={{marginTop:8,padding:"6px 10px",background:"var(--bg2)",borderRadius:6,fontSize:12,color:"var(--text2)"}}>💬 {item.adminNote}</div>}
            </div>
          ))}
        </div>
      );
    }

    // ═══════════════════════════════════════════════════
    // ── ChartsTab — гравець бачить свій графік ──
    // ═══════════════════════════════════════════════════
    function ChartsTab({ userId, profile }) {
      const [gameData, setGameData] = useState(null);
      const [loading, setLoading] = useState(true);
      const db = window._fbDb;

      useEffect(() => {
        const unsub = window._fb.onSnapshot(
          window._fb.doc(db, "gameSchedule", "main"),
          snap => { setGameData(snap.exists() ? snap.data() : null); setLoading(false); },
          err => { console.error(err); setLoading(false); }
        );
        return unsub;
      }, []);

      if (loading) return <div className="spinner" />;

      const slots = gameData?.slots || {};
      const players = gameData?.players || [];
      const myInfo = players.find(p => p.uid === userId);
      const dates = generateScheduleDates();

      // Рахуємо мої призначення
      let myTurns = 0;
      let myNextSlot = null;
      const now = new Date(); now.setHours(0,0,0,0);

      Object.entries(slots).forEach(([key, slot]) => {
        if (!slot?.infected) return;
        const isMe = slot.infected.some(i => i.uid === userId);
        if (isMe) {
          myTurns++;
          // Знаходимо найближчий наступний
          const [dateStr] = key.split("_");
          const d = new Date(dateStr);
          if (d >= now && (!myNextSlot || d < new Date(myNextSlot.split("_")[0]))) myNextSlot = key;
        }
      });

      const myPenalties = (gameData?.penalties || []).filter(p => p.uid === userId);

      return (
        <div className="page-content">
          <div className="game-header-banner">
            <div className="game-banner-title">🧟 Заражений</div>
            <div className="game-banner-sub">Ваш графік гри</div>
            <div className="game-banner-stats">
              <div className="game-stat-pill">⚡ Сила: {myInfo?.power || profile?.gamePower || 1}</div>
              <div className="game-stat-pill">🎮 Змін: {myTurns}</div>
              {myInfo?.dayOffs > 0 && <div className="game-stat-pill">🌙 Отгули: {myInfo.dayOffs}</div>}
            </div>
          </div>

          {myNextSlot && (() => {
            const [dateStr, brId] = myNextSlot.split("_");
            const d = new Date(dateStr);
            const br = BREAKS.find(b => b.id === parseInt(brId));
            return (
              <div style={{background:"linear-gradient(135deg,#C53030,#E53E3E)",borderRadius:14,padding:"14px 18px",marginBottom:16,color:"white"}}>
                <div style={{fontSize:11,opacity:0.8,marginBottom:4}}>⚠️ НАСТУПНА ЗМІНА ЗАРАЖЕНОГО</div>
                <div style={{fontFamily:"'Unbounded',sans-serif",fontSize:15,fontWeight:700}}>{formatShortDate(d)} — {br?.label}</div>
                <div style={{fontSize:12,opacity:0.8,marginTop:2}}>{br?.duration} хвилин · {DAY_NAMES[d.getDay()]}</div>
              </div>
            );
          })()}

          {!gameData ? (
            <div className="empty-state"><div className="empty-state-icon">⏳</div><div className="empty-state-text">Графік ще не згенеровано.<br/>Суддя скоро його налаштує.</div></div>
          ) : (
            <>
              <div className="section-title">📅 Розклад на 2 тижні</div>
              {dates.map(date => {
                const dateKey = date.toISOString().split("T")[0];
                const daySlots = BREAKS.map(br => {
                  const slotKey = `${dateKey}_${br.id}`;
                  const slot = slots[slotKey];
                  const isMeInfected = slot?.infected?.some(i => i.uid === userId);
                  return { br, slot, slotKey, isMeInfected };
                });
                const hasMeToday = daySlots.some(s => s.isMeInfected);
                return (
                  <div key={dateKey} className="schedule-day-block" style={{borderLeft: hasMeToday ? "4px solid #C53030" : undefined}}>
                    <div className="schedule-day-header">
                      <div className="schedule-day-name">{DAY_NAMES[date.getDay()]}, {formatShortDate(date)}</div>
                      {hasMeToday && <div style={{fontSize:11,color:"rgba(255,255,255,0.9)",fontWeight:700}}>🧟 Ваша зміна</div>}
                    </div>
                    {daySlots.map(({ br, slot, isMeInfected }) => (
                      <div key={br.id} className="schedule-break-row" style={{background: isMeInfected ? "#FFF5F5" : undefined}}>
                        <div className="break-label">{br.label}</div>
                        <div className="break-duration">{br.duration}хв</div>
                        <div className="infected-slot">
                          {slot?.infected?.map((inf, i) => (
                            <div key={i} className={`infected-chip p${inf.power||1}${inf.uid===userId?" isMeInfected":""}`}
                              style={inf.uid===userId ? {background:"#FED7D7",color:"#C53030",border:"1px solid #FC8181",fontWeight:800} : {}}>
                              🧟 {inf.name} <span style={{fontSize:9,opacity:0.7}}>×{inf.power||1}</span>
                            </div>
                          ))}
                          {(!slot?.infected || slot.infected.length === 0) && <div className="break-empty">—</div>}
                          {slot?.dayOff?.includes(userId) && <div className="infected-chip dayoff">🌙 отгул</div>}
                        </div>
                      </div>
                    ))}
                  </div>
                );
              })}

              {myPenalties.length > 0 && (
                <>
                  <div className="section-title" style={{marginTop:8}}>⚖️ Штрафи та бонуси</div>
                  <div className="info-card">
                    {myPenalties.map((p, i) => (
                      <div key={i} className="info-row">
                        <div className="info-row-label">{p.reason}</div>
                        <div>
                          <span className={`penalty-chip ${p.type === "fine" ? "fine" : "dayoff-bonus"}`}>
                            {p.type === "fine" ? `⚡ +${p.value} змін` : `🌙 +${p.value} отгул`}
                          </span>
                        </div>
                      </div>
                    ))}
                  </div>
                </>
              )}
            </>
          )}
        </div>
      );
    }

    // ═══════════════════════════════════════════════════
    // ── AdminScheduleTab — повне управління графіком ──
    // ═══════════════════════════════════════════════════
    function AdminScheduleTab({ allUsers }) {
      const [gameData, setGameData] = useState(null);
      const [loading, setLoading] = useState(true);
      const [saving, setSaving] = useState(false);
      const [view, setView] = useState("schedule"); // schedule | players | stats
      const [selectedSlot, setSelectedSlot] = useState(null); // {slotKey, slot}
      const [showSlotModal, setShowSlotModal] = useState(false);
      const [showPlayerModal, setShowPlayerModal] = useState(false);
      const [selectedPlayer, setSelectedPlayer] = useState(null);
      const [showPenaltyModal, setShowPenaltyModal] = useState(false);
      const [penaltyType, setPenaltyType] = useState("fine");
      const [penaltyReason, setPenaltyReason] = useState("");
      const [penaltyValue, setPenaltyValue] = useState(1);
      const [weekOffset, setWeekOffset] = useState(0);
      const db = window._fbDb;

      useEffect(() => {
        const unsub = window._fb.onSnapshot(
          window._fb.doc(db, "gameSchedule", "main"),
          snap => { setGameData(snap.exists() ? snap.data() : { slots: {}, players: [], penalties: [], generatedAt: null }); setLoading(false); },
          err => { console.error(err); setLoading(false); }
        );
        return unsub;
      }, []);

      const players = useMemo(() => {
        const base = gameData?.players || [];
        // Збагачуємо даними з allUsers
        return base.map(p => {
          const u = allUsers.find(u => u.uid === p.uid);
          return { ...p, firstName: u?.firstName || p.firstName || "?", lastName: u?.lastName || p.lastName || "", photoUrl: u?.photoUrl || p.photoUrl || "" };
        });
      }, [gameData, allUsers]);

      const slots = gameData?.slots || {};
      const penalties = gameData?.penalties || [];

      // Дати для поточного тижня (weekOffset)
      const allDates = generateScheduleDates();
      const week1 = allDates.slice(0, 5);
      const week2 = allDates.slice(5, 10);
      const currentWeekDates = weekOffset === 0 ? week1 : week2;

      // Рахуємо статистику
      const playerStats = useMemo(() => {
        const stats = {};
        players.forEach(p => { stats[p.uid] = { turns: 0, dayOffs: 0 }; });
        Object.values(slots).forEach(slot => {
          slot?.infected?.forEach(inf => { if (stats[inf.uid]) stats[inf.uid].turns++; });
          slot?.dayOff?.forEach(uid => { if (stats[uid]) stats[uid].dayOffs++; });
        });
        // Додаємо штрафи (fine = додаткові зміни)
        penalties.forEach(pen => {
          if (!stats[pen.uid]) return;
          if (pen.type === "fine") stats[pen.uid].turns += (pen.value || 0);
          if (pen.type === "dayoff") stats[pen.uid].dayOffs += (pen.value || 0);
        });
        return stats;
      }, [players, slots, penalties]);

      const maxTurns = Math.max(1, ...Object.values(playerStats).map(s => s.turns));

      async function saveData(newData) {
        setSaving(true);
        try {
          await window._fb.setDoc(window._fb.doc(db, "gameSchedule", "main"), newData);
        } catch(e) { alert("Помилка збереження: " + e.message); }
        setSaving(false);
      }

      async function handleAutoGenerate() {
        if (!window.confirm("Автоматично згенерувати розклад на 2 тижні? Існуючі слоти залишаться.")) return;
        const playersForGen = players.map(p => ({
          uid: p.uid, firstName: p.firstName, lastName: p.lastName,
          power: p.power || 1, bannedFromGame: p.bannedFromGame || false
        }));
        const newSlots = autoGenerateSchedule(playersForGen, slots);
        const newData = { ...gameData, slots: newSlots, generatedAt: new Date().toISOString() };
        await saveData(newData);
      }

      async function handleClearSchedule() {
        if (!window.confirm("Очистити весь розклад? Гравці залишаться.")) return;
        await saveData({ ...gameData, slots: {} });
      }

      // Додати гравця до списку
      async function addPlayerToGame(user) {
        const already = players.find(p => p.uid === user.uid);
        if (already) return alert("Гравець вже є у грі");
        const newPlayers = [...players, { uid: user.uid, firstName: user.firstName, lastName: user.lastName, photoUrl: user.photoUrl || "", power: 1, bannedFromGame: false, dayOffs: 0 }];
        await saveData({ ...gameData, players: newPlayers });
      }

      // Оновити гравця
      async function updatePlayer(uid, upd) {
        const newPlayers = players.map(p => p.uid === uid ? { ...p, ...upd } : p);
        await saveData({ ...gameData, players: newPlayers });
        setSelectedPlayer(prev => prev && prev.uid === uid ? { ...prev, ...upd } : prev);
      }

      // Видалити гравця з гри
      async function removePlayerFromGame(uid) {
        if (!window.confirm("Видалити гравця з графіку гри?")) return;
        const newPlayers = players.filter(p => p.uid !== uid);
        // Видаляємо зі всіх слотів
        const newSlots = {};
        Object.entries(slots).forEach(([k, v]) => {
          newSlots[k] = {
            ...v,
            infected: (v.infected || []).filter(i => i.uid !== uid),
            dayOff: (v.dayOff || []).filter(id => id !== uid)
          };
        });
        await saveData({ ...gameData, players: newPlayers, slots: newSlots });
        setSelectedPlayer(null);
      }

      // Видати отгул на конкретний слот
      async function giveSlotDayOff(slotKey, uid) {
        const slot = slots[slotKey] || { infected: [], dayOff: [] };
        // Прибираємо зі заражених
        const newInfected = (slot.infected || []).filter(i => i.uid !== uid);
        const newDayOff = [...new Set([...(slot.dayOff || []), uid])];
        const newSlots = { ...slots, [slotKey]: { ...slot, infected: newInfected, dayOff: newDayOff } };
        await saveData({ ...gameData, slots: newSlots });
      }

      // Скасувати отгул
      async function cancelSlotDayOff(slotKey, uid) {
        const slot = slots[slotKey] || { infected: [], dayOff: [] };
        const newDayOff = (slot.dayOff || []).filter(id => id !== uid);
        const newSlots = { ...slots, [slotKey]: { ...slot, dayOff: newDayOff } };
        await saveData({ ...gameData, slots: newSlots });
      }

      // Додати штраф
      async function addPenalty() {
        if (!penaltyReason) return alert("Вкажіть причину");
        const newPenalties = [...penalties, { uid: selectedPlayer.uid, name: `${selectedPlayer.firstName} ${selectedPlayer.lastName}`.trim(), type: penaltyType, reason: penaltyReason, value: penaltyValue, createdAt: new Date().toISOString() }];
        await saveData({ ...gameData, penalties: newPenalties });
        setShowPenaltyModal(false); setPenaltyReason(""); setPenaltyValue(1);
      }

      // Редагувати слот (ручне призначення)
      async function handleSlotSave(slotKey, newInfected) {
        const slot = slots[slotKey] || { infected: [], dayOff: [] };
        const newSlots = { ...slots, [slotKey]: { ...slot, infected: newInfected } };
        await saveData({ ...gameData, slots: newSlots });
        setShowSlotModal(false);
      }

      if (loading) return <div className="spinner" />;

      return (
        <div>
          {/* Таби всередині адмін-графіку */}
          <div style={{display:"flex",gap:6,padding:"12px 16px 0",background:"white",borderBottom:"1px solid var(--border)"}}>
            {[["schedule","📅 Розклад"],["players","👥 Гравці"],["stats","📊 Статистика"]].map(([k,v]) => (
              <button key={k} onClick={() => setView(k)} style={{padding:"8px 14px",border:"none",borderRadius:"8px 8px 0 0",background:view===k?"var(--accent)":"transparent",color:view===k?"white":"var(--text2)",fontWeight:700,fontSize:12,cursor:"pointer",fontFamily:"'Raleway',sans-serif"}}>{v}</button>
            ))}
            {saving && <div style={{marginLeft:"auto",fontSize:11,color:"var(--text2)",alignSelf:"center"}}>💾 Збереження…</div>}
          </div>

          <div className="page-content" style={{paddingTop:16,paddingBottom:40}}>

            {/* ── РОЗКЛАД ── */}
            {view === "schedule" && (
              <>
                {/* Кнопки управління */}
                <div style={{display:"flex",gap:8,marginBottom:16,flexWrap:"wrap"}}>
                  <button className="btn-primary" style={{flex:1,padding:"11px 10px",fontSize:12,minWidth:120}} onClick={handleAutoGenerate}>🔄 Автогенерація</button>
                  <button className="btn-danger" style={{flex:1,fontSize:12,minWidth:100}} onClick={handleClearSchedule}>🗑 Очистити</button>
                </div>
                {gameData?.generatedAt && <div style={{fontSize:11,color:"var(--text2)",marginBottom:12}}>📅 Згенеровано: {new Date(gameData.generatedAt).toLocaleDateString("uk-UA")}</div>}

                {/* Перемикач тижнів */}
                <div className="week-tabs">
                  <button className={`week-tab${weekOffset===0?" active":""}`} onClick={() => setWeekOffset(0)}>1-й тиждень</button>
                  <button className={`week-tab${weekOffset===1?" active":""}`} onClick={() => setWeekOffset(1)}>2-й тиждень</button>
                </div>

                {players.length === 0 ? (
                  <div className="empty-state"><div className="empty-state-icon">👥</div><div className="empty-state-text">Спочатку додайте гравців у вкладці "Гравці"</div></div>
                ) : currentWeekDates.map(date => {
                  const dateKey = date.toISOString().split("T")[0];
                  return (
                    <div key={dateKey} className="schedule-day-block">
                      <div className="schedule-day-header">
                        <div className="schedule-day-name">{DAY_NAMES[date.getDay()]}, {formatShortDate(date)}</div>
                      </div>
                      {BREAKS.map(br => {
                        const slotKey = `${dateKey}_${br.id}`;
                        const slot = slots[slotKey];
                        return (
                          <div key={br.id} className="schedule-break-row" style={{cursor:"pointer"}} onClick={() => { setSelectedSlot({slotKey, slot, date, br}); setShowSlotModal(true); }}>
                            <div className="break-label">{br.label}</div>
                            <div className="break-duration">{br.duration}хв</div>
                            <div className="infected-slot">
                              {slot?.infected?.map((inf, i) => (
                                <div key={i} className={`infected-chip p${inf.power||1}`}>🧟 {inf.name} ×{inf.power||1}</div>
                              ))}
                              {slot?.dayOff?.length > 0 && slot.dayOff.map(uid => {
                                const p = players.find(p => p.uid === uid);
                                return p ? <div key={uid} className="infected-chip dayoff">🌙 {p.firstName}</div> : null;
                              })}
                              {(!slot?.infected || slot.infected.length === 0) && (!slot?.dayOff || slot.dayOff.length === 0) && (
                                <div className="break-empty">Натисніть щоб призначити</div>
                              )}
                            </div>
                            <div style={{fontSize:14,color:"var(--text2)",marginLeft:"auto"}}>✏️</div>
                          </div>
                        );
                      })}
                    </div>
                  );
                })}
              </>
            )}

            {/* ── ГРАВЦІ ── */}
            {view === "players" && (
              <>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
                  <div className="section-title" style={{marginBottom:0}}>👥 Гравці гри ({players.length})</div>
                  <button className="btn-primary" style={{width:"auto",padding:"9px 16px",fontSize:12}} onClick={() => { setSelectedPlayer(null); setShowPlayerModal(true); }}>+ Додати</button>
                </div>
                {players.length === 0 && <div className="empty-state"><div className="empty-state-icon">👥</div><div className="empty-state-text">Додайте гравців</div></div>}
                {players.map(p => {
                  const st = playerStats[p.uid] || { turns: 0 };
                  return (
                    <div key={p.uid} className="admin-user-card" onClick={() => setSelectedPlayer(p)}>
                      <div className="user-mini-photo">{p.photoUrl ? <img src={p.photoUrl} alt="" /> : <span>{(p.firstName?.[0]||"")+(p.lastName?.[0]||"")}</span>}</div>
                      <div style={{flex:1}}>
                        <div style={{fontWeight:700,fontSize:14}}>{p.firstName} {p.lastName}</div>
                        <div style={{fontSize:12,color:"var(--text2)"}}>⚡ Сила: {p.power||1} · 🎮 Змін: {st.turns}</div>
                        {p.bannedFromGame && <div style={{fontSize:11,color:"var(--danger)",fontWeight:700}}>⛔ Відсторонено</div>}
                      </div>
                      <div className="infected-count-badge">{st.turns}</div>
                    </div>
                  );
                })}
              </>
            )}

            {/* ── СТАТИСТИКА ── */}
            {view === "stats" && (
              <>
                <div className="section-title">📊 Статистика гравців</div>
                <div className="stats-grid">
                  <div className="stat-card"><div className="stat-card-val">{players.filter(p=>!p.bannedFromGame).length}</div><div className="stat-card-label">Активних гравців</div></div>
                  <div className="stat-card"><div className="stat-card-val">{Object.keys(slots).length}</div><div className="stat-card-label">Слотів у розкладі</div></div>
                  <div className="stat-card"><div className="stat-card-val">{penalties.length}</div><div className="stat-card-label">Штрафів / Отгулів</div></div>
                  <div className="stat-card"><div className="stat-card-val">{maxTurns}</div><div className="stat-card-label">Макс. змін</div></div>
                </div>

                <div className="section-title">🎮 Рейтинг змін заражених</div>
                <div className="info-card">
                  {[...players].sort((a,b) => (playerStats[b.uid]?.turns||0) - (playerStats[a.uid]?.turns||0)).map((p,i) => {
                    const st = playerStats[p.uid] || { turns:0 };
                    const pct = maxTurns > 0 ? (st.turns / maxTurns * 100) : 0;
                    return (
                      <div key={p.uid} className="player-row">
                        <div style={{fontSize:13,fontWeight:800,color:"var(--text2)",minWidth:20}}>#{i+1}</div>
                        <div className="player-avatar-sm">{p.photoUrl ? <img src={p.photoUrl} alt="" /> : <span>{(p.firstName?.[0]||"")+(p.lastName?.[0]||"")}</span>}</div>
                        <div style={{flex:1}}>
                          <div className="player-info-name">{p.firstName} {p.lastName}</div>
                          <div className="player-info-sub">⚡ Сила {p.power||1} · 🌙 Отгулів: {st.dayOffs}</div>
                          <div className="turns-bar-wrap" style={{marginLeft:0,marginTop:4}}>
                            <div className="turns-bar-bg"><div className="turns-bar-fill" style={{width:`${pct}%`}} /></div>
                          </div>
                        </div>
                        <div className="infected-count-badge">{st.turns}</div>
                      </div>
                    );
                  })}
                </div>

                {penalties.length > 0 && (
                  <>
                    <div className="section-title" style={{marginTop:8}}>⚖️ Штрафи та отгули</div>
                    <div className="info-card">
                      {penalties.map((pen,i) => (
                        <div key={i} className="info-row">
                          <div>
                            <div className="info-row-label">{pen.name}</div>
                            <div style={{fontSize:11,color:"var(--text2)"}}>{pen.reason}</div>
                          </div>
                          <span className={`penalty-chip ${pen.type==="fine"?"fine":"dayoff-bonus"}`}>
                            {pen.type==="fine" ? `⚡ +${pen.value} змін` : `🌙 +${pen.value} отгул`}
                          </span>
                        </div>
                      ))}
                    </div>
                  </>
                )}
              </>
            )}
          </div>

          {/* ── МОДАЛ: Редагування слоту ── */}
          {showSlotModal && selectedSlot && (
            <SlotEditModal
              slot={selectedSlot}
              players={players}
              onSave={handleSlotSave}
              onDayOff={giveSlotDayOff}
              onCancelDayOff={cancelSlotDayOff}
              onClose={() => setShowSlotModal(false)}
            />
          )}

          {/* ── МОДАЛ: Картка гравця ── */}
          {selectedPlayer && (
            <div className="modal-backdrop" onClick={e => e.target===e.currentTarget && setSelectedPlayer(null)}>
              <div className="modal-sheet">
                <div className="modal-handle" />
                <div className="modal-title">👤 {selectedPlayer.firstName} {selectedPlayer.lastName}</div>

                {/* Сила */}
                <div className="input-label" style={{marginBottom:8}}>Сила зараженого</div>
                <div className="power-selector" style={{marginBottom:20}}>
                  {[1,2,3].map(pw => (
                    <button key={pw} className={`power-btn p${pw}${(selectedPlayer.power||1)===pw?" sel":""}`}
                      onClick={() => updatePlayer(selectedPlayer.uid, {power: pw})}>
                      {pw===1?"⚡ 1 — Слабкий":pw===2?"⚡⚡ 2 — Сильний":"⚡⚡⚡ 3 — Монстр"}
                    </button>
                  ))}
                </div>

                {/* Статистика */}
                <div className="info-card" style={{marginBottom:16}}>
                  {[
                    ["Змін зараженим", playerStats[selectedPlayer.uid]?.turns || 0],
                    ["Отгулів", playerStats[selectedPlayer.uid]?.dayOffs || 0],
                    ["Штрафів", penalties.filter(p => p.uid === selectedPlayer.uid && p.type==="fine").length],
                  ].map(([l,v]) => (
                    <div key={l} className="info-row"><div className="info-row-label">{l}</div><div className="info-row-value" style={{fontFamily:"'Unbounded',sans-serif",color:"var(--accent)"}}>{v}</div></div>
                  ))}
                </div>

                <div style={{display:"flex",flexDirection:"column",gap:10}}>
                  <button className="btn-outline" onClick={() => { setShowPenaltyModal(true); }}>⚖️ Штраф / Отгул</button>
                  <button className={selectedPlayer.bannedFromGame ? "btn-success" : "btn-danger"}
                    onClick={() => updatePlayer(selectedPlayer.uid, {bannedFromGame: !selectedPlayer.bannedFromGame})}>
                    {selectedPlayer.bannedFromGame ? "✅ Повернути до гри" : "⛔ Відсторонити від гри"}
                  </button>
                  <button className="btn-danger" style={{background:"#744210"}} onClick={() => removePlayerFromGame(selectedPlayer.uid)}>🗑 Видалити з графіку</button>
                  <button className="btn-secondary" onClick={() => setSelectedPlayer(null)}>Закрити</button>
                </div>
              </div>
            </div>
          )}

          {/* ── МОДАЛ: Штраф/Отгул ── */}
          {showPenaltyModal && selectedPlayer && (
            <div className="modal-backdrop" onClick={e => e.target===e.currentTarget && setShowPenaltyModal(false)}>
              <div className="modal-sheet">
                <div className="modal-handle" />
                <div className="modal-title">⚖️ Штраф або Отгул</div>
                <div style={{display:"flex",gap:8,marginBottom:16}}>
                  <button className={`power-btn p3${penaltyType==="fine"?" sel":""}`} style={{border:"2px solid",borderColor:penaltyType==="fine"?"#C53030":"var(--border)"}} onClick={() => setPenaltyType("fine")}>⚡ Штраф (доп.зміна)</button>
                  <button className={`power-btn p1${penaltyType==="dayoff"?" sel":""}`} style={{border:"2px solid",borderColor:penaltyType==="dayoff"?"#276749":"var(--border)"}} onClick={() => setPenaltyType("dayoff")}>🌙 Отгул</button>
                </div>
                <div className="input-group"><div className="input-label">Причина</div><input className="input-field" value={penaltyReason} onChange={e => setPenaltyReason(e.target.value)} placeholder="Причина штрафу або отгулу..." /></div>
                <div className="input-group">
                  <div className="input-label">Кількість</div>
                  <select className="select-field" value={penaltyValue} onChange={e => setPenaltyValue(Number(e.target.value))}>
                    {[1,2,3,4,5].map(v => <option key={v} value={v}>{v}</option>)}
                  </select>
                </div>
                <button className="btn-primary" onClick={addPenalty}>Застосувати</button>
                <button className="btn-secondary" onClick={() => setShowPenaltyModal(false)}>Скасувати</button>
              </div>
            </div>
          )}

          {/* ── МОДАЛ: Додати гравця ── */}
          {showPlayerModal && (
            <AddPlayerModal
              allUsers={allUsers}
              existingPlayers={players}
              onAdd={addPlayerToGame}
              onClose={() => setShowPlayerModal(false)}
            />
          )}
        </div>
      );
    }

    // ── Модал редагування слоту ──
    function SlotEditModal({ slot, players, onSave, onDayOff, onCancelDayOff, onClose }) {
      const { slotKey, date, br } = slot;
      const existingSlot = slot.slot || { infected: [], dayOff: [] };
      const [infected, setInfected] = useState(existingSlot.infected || []);
      const totalPower = infected.reduce((s, i) => s + (i.power || 1), 0);

      function togglePlayer(p) {
        const existing = infected.find(i => i.uid === p.uid);
        if (existing) {
          setInfected(infected.filter(i => i.uid !== p.uid));
        } else {
          setInfected([...infected, { uid: p.uid, name: `${p.firstName} ${p.lastName||""}`.trim(), power: p.power || 1 }]);
        }
      }

      return (
        <div className="modal-backdrop" onClick={e => e.target===e.currentTarget && onClose()}>
          <div className="modal-sheet">
            <div className="modal-handle" />
            <div className="modal-title">✏️ {br.label} — {formatShortDate(date)}</div>
            <div style={{fontSize:13,color:"var(--text2)",marginBottom:16}}>{br.duration} хвилин · Загальна сила заражених: <b style={{color:totalPower===3?"var(--success)":totalPower>3?"var(--danger)":"var(--text)"}}>{totalPower}/3</b></div>

            <div className="input-label" style={{marginBottom:8}}>Оберіть заражених (сума сил = 3)</div>
            <div className="player-select-list">
              {players.filter(p => !p.bannedFromGame).map(p => {
                const isSelected = infected.some(i => i.uid === p.uid);
                const isDayOff = existingSlot.dayOff?.includes(p.uid);
                return (
                  <div key={p.uid} className={`player-select-item${isSelected?" selected":""}${isDayOff?" banned-from-game":""}`}
                    onClick={() => !isDayOff && togglePlayer(p)}>
                    <div className={`psi-check${isSelected?" checked":""}`}>{isSelected?"✓":""}</div>
                    <div className="user-mini-photo" style={{width:32,height:32}}>{p.photoUrl ? <img src={p.photoUrl} alt="" /> : <span style={{fontSize:14}}>{p.firstName?.[0]||"?"}</span>}</div>
                    <div style={{flex:1}}>
                      <div style={{fontSize:13,fontWeight:700}}>{p.firstName} {p.lastName}</div>
                      <div style={{fontSize:11,color:"var(--text2)"}}>⚡ Сила {p.power||1}{isDayOff?" · 🌙 отгул":""}</div>
                    </div>
                    {isSelected && <div className={`infected-chip p${p.power||1}`}>×{p.power||1}</div>}
                  </div>
                );
              })}
            </div>

            {/* Отгули */}
            {infected.length > 0 && (
              <div style={{marginBottom:16}}>
                <div className="input-label" style={{marginBottom:8}}>Видати отгул (знімає зі слоту)</div>
                {infected.map(inf => (
                  <div key={inf.uid} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"6px 0",borderBottom:"1px solid var(--bg2)"}}>
                    <div style={{fontSize:13}}>🧟 {inf.name}</div>
                    <button className="btn-outline" style={{padding:"4px 10px",fontSize:11}} onClick={() => { onDayOff(slotKey, inf.uid); onClose(); }}>🌙 Отгул</button>
                  </div>
                ))}
              </div>
            )}

            {existingSlot.dayOff?.length > 0 && (
              <div style={{marginBottom:16}}>
                <div className="input-label" style={{marginBottom:8}}>Скасувати отгул</div>
                {existingSlot.dayOff.map(uid => {
                  const p = players.find(p => p.uid === uid);
                  return p ? (
                    <div key={uid} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"6px 0"}}>
                      <div style={{fontSize:13}}>🌙 {p.firstName} {p.lastName}</div>
                      <button className="btn-danger" style={{padding:"4px 10px",fontSize:11}} onClick={() => { onCancelDayOff(slotKey, uid); onClose(); }}>✕ Скасувати</button>
                    </div>
                  ) : null;
                })}
              </div>
            )}

            <button className="btn-primary" onClick={() => onSave(slotKey, infected)}>💾 Зберегти</button>
            <button className="btn-secondary" onClick={onClose}>Скасувати</button>
          </div>
        </div>
      );
    }

    // ── Модал додавання гравця ──
    function AddPlayerModal({ allUsers, existingPlayers, onAdd, onClose }) {
      const [search, setSearch] = useState("");
      const available = allUsers.filter(u => {
        const notIn = !existingPlayers.find(p => p.uid === u.uid);
        const matchSearch = !search || `${u.firstName} ${u.lastName} ${u.email}`.toLowerCase().includes(search.toLowerCase());
        return notIn && matchSearch && !u.banned;
      });
      return (
        <div className="modal-backdrop" onClick={e => e.target===e.currentTarget && onClose()}>
          <div className="modal-sheet">
            <div className="modal-handle" />
            <div className="modal-title">👥 Додати гравця</div>
            <div className="input-group"><input className="input-field" value={search} onChange={e => setSearch(e.target.value)} placeholder="Пошук за ім'ям..." /></div>
            <div className="player-select-list">
              {available.length === 0 && <div style={{padding:20,textAlign:"center",color:"var(--text2)",fontSize:13}}>Немає доступних гравців</div>}
              {available.map(u => (
                <div key={u.uid} className="player-select-item" onClick={() => { onAdd(u); onClose(); }}>
                  <div className="user-mini-photo" style={{width:36,height:36}}>{u.photoUrl ? <img src={u.photoUrl} alt="" /> : <span style={{fontSize:14}}>{u.firstName?.[0]||"?"}</span>}</div>
                  <div><div style={{fontSize:13,fontWeight:700}}>{u.firstName} {u.lastName}</div><div style={{fontSize:11,color:"var(--text2)"}}>{u.grade} · {u.email}</div></div>
                </div>
              ))}
            </div>
            <button className="btn-secondary" onClick={onClose}>Скасувати</button>
          </div>
        </div>
      );
    }

    // ═══════════════════════════════════════════════════
    // ── AdminPanel ──
    // ═══════════════════════════════════════════════════
    function AdminPanel({ adminProfile }) {
      const [activeAdminTab, setActiveAdminTab] = useState("users");
      const [users, setUsers] = useState([]);
      const [courtCases, setCourtCases] = useState([]);
      const [loading, setLoading] = useState(true);
      const [selectedUser, setSelectedUser] = useState(null);
      const [editMode, setEditMode] = useState(false);
      const [editData, setEditData] = useState({});
      const [editPhotoUrl, setEditPhotoUrl] = useState("");
      const [showReportModal, setShowReportModal] = useState(false);
      const [reportTarget, setReportTarget] = useState(null);
      const [reportTitle, setReportTitle] = useState("");
      const [reportBody, setReportBody] = useState("");
      const [reportType, setReportType] = useState("Повідомлення");
      const [caseNote, setCaseNote] = useState("");
      const [selectedCase, setSelectedCase] = useState(null);
      const [showCourtModal, setShowCourtModal] = useState(false);
      const [newAccused, setNewAccused] = useState("");
      const [newCrimeType, setNewCrimeType] = useState("");
      const [newDescription, setNewDescription] = useState("");
      const [newDefendantName, setNewDefendantName] = useState("");
      const [submittingCourt, setSubmittingCourt] = useState(false);
      const editPhotoRef = useRef();
      const db = window._fbDb;
      const auth = window._fbAuth;

      async function toggleBan(user) { await window._fb.updateDoc(window._fb.doc(db,"users",user.uid),{banned:!user.banned}); }
      async function saveEdit() {
        const update = {...editData};
        if (editPhotoUrl) update.photoUrl = editPhotoUrl;
        await window._fb.updateDoc(window._fb.doc(db,"users",selectedUser.uid), update);
        setEditMode(false); setSelectedUser({...selectedUser,...update}); setEditPhotoUrl("");
      }
      async function sendReport() {
        if (!reportTitle || !reportBody) return alert("Заповніть поля");
        await window._fb.addDoc(window._fb.collection(db,"reports"),{
          userId:reportTarget.uid, title:reportTitle, body:reportBody,
          type:reportType, read:false, createdAt:window._fb.serverTimestamp()
        });
        setShowReportModal(false); setReportTitle(""); setReportBody("");
      }
      async function resolveCase(caseId, status) {
        await window._fb.updateDoc(window._fb.doc(db,"court",caseId),{status,adminNote:caseNote});
        setSelectedCase(null); setCaseNote("");
      }
      async function submitAdminCase() {
        if (!newDefendantName || !newCrimeType || !newDescription) return alert("Заповніть всі поля");
        setSubmittingCourt(true);
        try {
          await window._fb.addDoc(window._fb.collection(db,"court"), {
            plaintiffId:"admin", plaintiffName:"Суддя", accused:newDefendantName,
            crimeType:newCrimeType, description:newDescription, status:"pending", createdAt:window._fb.serverTimestamp()
          });
          setShowCourtModal(false); setNewDefendantName(""); setNewCrimeType(""); setNewDescription("");
        } catch(e) { alert("Помилка: " + e.message); }
        setSubmittingCourt(false);
      }
      function handleEditPhoto(e) {
        const file = e.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = ev => { if (ev.target.result.length > 800000) { alert("Фото занадто велике"); return; } setEditPhotoUrl(ev.target.result); };
        reader.readAsDataURL(file);
      }

      const GRADES = ["5 клас","6 клас","7 клас","8 клас","9 клас"];
      if (loading) return <div className="spinner" />;

      return (
        <div style={{background:"var(--bg)",minHeight:"100vh"}}>
          <div className="header">
            <div className="header-logo">НД</div>
            <div><div className="header-title">НікусДія</div><div className="header-sub">Панель судді</div></div>
            <span className="admin-badge" style={{marginLeft:"auto"}}>⚖️ СУДДЯ</span>
            <button className="header-logout" style={{marginLeft:10}} onClick={() => window._fb.signOut(auth)}>Вийти</button>
          </div>
          <div style={{display:"flex",borderBottom:"2px solid var(--border)",background:"white",overflowX:"auto"}}>
            {[["users","👥 Учні"],["court","⚖️ Суд"],["schedule","🧟 Гра"]].map(([k,v]) => (
              <button key={k} onClick={() => setActiveAdminTab(k)} style={{flex:1,padding:"14px 8px",border:"none",background:"transparent",fontFamily:"'Raleway',sans-serif",fontWeight:700,fontSize:12,cursor:"pointer",color:activeAdminTab===k?"var(--accent)":"var(--text2)",borderBottom:activeAdminTab===k?"3px solid var(--accent)":"3px solid transparent",transition:"all 0.2s",whiteSpace:"nowrap"}}>{v}</button>
            ))}
          </div>

          {activeAdminTab === "schedule" && <AdminScheduleTab allUsers={users} />}

          {activeAdminTab !== "schedule" && (
            <div className="page-content" style={{paddingBottom:40}}>
              {activeAdminTab === "users" && (
                <>
                  <div className="section-title">👥 Всі учні ({users.length})</div>
                  {users.map(u => (
                    <div key={u.uid||u.id} className="admin-user-card" onClick={() => { setSelectedUser(u); setEditData({firstName:u.firstName||"",lastName:u.lastName||"",grade:u.grade||"",contact:u.contact||""}); setEditPhotoUrl(""); }}>
                      <div className="user-mini-photo">{u.photoUrl ? <img src={u.photoUrl} alt="" /> : <span>{(u.firstName?.[0]||"")+(u.lastName?.[0]||"")}</span>}</div>
                      <div style={{flex:1}}>
                        <div style={{fontWeight:700,fontSize:14}}>{u.firstName} {u.lastName}</div>
                        <div style={{fontSize:12,color:"var(--text2)"}}>{u.grade} · {u.email}</div>
                      </div>
                      {u.banned && <span style={{fontSize:11,color:"var(--danger)",fontWeight:700}}>БАН</span>}
                    </div>
                  ))}
                </>
              )}
              {activeAdminTab === "court" && (
                <>
                  <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
                    <div className="section-title" style={{marginBottom:0}}>⚖️ Судові справи ({courtCases.length})</div>
                    <button className="btn-primary" style={{width:"auto",padding:"9px 16px",fontSize:13}} onClick={() => setShowCourtModal(true)}>+ Нова справа</button>
                  </div>
                  {courtCases.length === 0 ? (
                    <div className="empty-state"><div className="empty-state-icon">⚖️</div><div className="empty-state-text">Справ поки немає</div></div>
                  ) : courtCases.map(c => (
                    <div key={c.id} className="court-card">
                      <div className={`court-status ${c.status}`}>{c.status==="pending"?"🔵 Розглядається":c.status==="approved"?"✅ Підтримано":"❌ Відхилено"}</div>
                      <div className="court-title">Позивач: {c.plaintiffName}</div>
                      <div className="court-sub">Проти: <b>{c.accused}</b></div>
                      <div className="court-sub">{c.crimeType}</div>
                      <div className="court-sub" style={{fontSize:12}}>{c.description}</div>
                      <div className="court-meta">{formatDate(c.createdAt)}</div>
                      {c.status === "pending" && (
                        <div style={{marginTop:10}}>
                          <textarea className="textarea-field" style={{minHeight:60,fontSize:13}} placeholder="Коментар судді..." value={selectedCase===c.id ? caseNote : ""} onChange={e => { setSelectedCase(c.id); setCaseNote(e.target.value); }} onClick={() => setSelectedCase(c.id)} />
                          <div className="court-admin-btns">
                            <button className="btn-success" onClick={() => resolveCase(c.id,"approved")}>✅ Підтримати</button>
                            <button className="btn-danger" onClick={() => resolveCase(c.id,"rejected")}>❌ Відхилити</button>
                          </div>
                        </div>
                      )}
                      {c.adminNote && <div style={{marginTop:8,padding:"8px 12px",background:"var(--bg2)",borderRadius:8,fontSize:13}}>💬 {c.adminNote}</div>}
                    </div>
                  ))}
                </>
              )}
            </div>
          )}

          {showCourtModal && (
            <div className="modal-backdrop" onClick={e => e.target===e.currentTarget && setShowCourtModal(false)}>
              <div className="modal-sheet">
                <div className="modal-handle" />
                <div className="modal-title">⚖️ Нова справа (від судді)</div>
                <div className="input-group"><div className="input-label">Звинувачений</div><input className="input-field" value={newDefendantName} onChange={e => setNewDefendantName(e.target.value)} placeholder="Ім'я / нікнейм" /></div>
                <div className="input-group">
                  <div className="input-label">Тип порушення</div>
                  <select className="select-field" value={newCrimeType} onChange={e => setNewCrimeType(e.target.value)}>
                    <option value="">Оберіть тип</option>
                    {["Порушення правил гри","Образа / цькування","Шахрайство","Крадіжка","Спам","Інше"].map(o => <option key={o}>{o}</option>)}
                  </select>
                </div>
                <div className="input-group"><div className="input-label">Опис</div><textarea className="textarea-field" value={newDescription} onChange={e => setNewDescription(e.target.value)} placeholder="Деталі справи..." /></div>
                <button className="btn-primary" onClick={submitAdminCase} disabled={submittingCourt}>{submittingCourt ? "Надсилання…" : "Відкрити справу"}</button>
                <button className="btn-secondary" onClick={() => setShowCourtModal(false)}>Скасувати</button>
              </div>
            </div>
          )}

          {selectedUser && (
            <div className="modal-backdrop" onClick={e => e.target===e.currentTarget && setSelectedUser(null)}>
              <div className="modal-sheet">
                <div className="modal-handle" />
                <IDCard profile={editPhotoUrl ? {...selectedUser,photoUrl:editPhotoUrl} : selectedUser} isAdmin={false} />
                {editMode ? (
                  <>
                    <div className="input-group">
                      <div className="input-label">Фото</div>
                      <div style={{display:"flex",alignItems:"center",gap:12}}>
                        <div style={{width:56,height:56,borderRadius:"50%",overflow:"hidden",border:"2px solid var(--border)",flexShrink:0,background:"var(--bg2)",display:"flex",alignItems:"center",justifyContent:"center"}}>
                          {editPhotoUrl ? <img src={editPhotoUrl} style={{width:"100%",height:"100%",objectFit:"cover"}} alt="" /> : selectedUser.photoUrl ? <img src={selectedUser.photoUrl} style={{width:"100%",height:"100%",objectFit:"cover"}} alt="" /> : <span style={{fontSize:22}}>👤</span>}
                        </div>
                        <button className="btn-outline" style={{flex:1}} onClick={() => editPhotoRef.current.click()}>📷 Змінити фото</button>
                        <input ref={editPhotoRef} type="file" accept="image/*" style={{display:"none"}} onChange={handleEditPhoto} />
                      </div>
                    </div>
                    {[["Ім'я","firstName"],["Прізвище","lastName"],["Контакт","contact"]].map(([l,k]) => (
                      <div key={k} className="input-group"><div className="input-label">{l}</div><input className="input-field" value={editData[k]} onChange={e => setEditData({...editData,[k]:e.target.value})} /></div>
                    ))}
                    <div className="input-group">
                      <div className="input-label">Клас</div>
                      <select className="select-field" value={editData.grade} onChange={e => setEditData({...editData,grade:e.target.value})}>
                        <option value="">Оберіть клас</option>
                        {GRADES.map(g => <option key={g} value={g}>{g}</option>)}
                      </select>
                    </div>
                    <button className="btn-primary" onClick={saveEdit}>💾 Зберегти</button>
                    <button className="btn-secondary" onClick={() => { setEditMode(false); setEditPhotoUrl(""); }}>Скасувати</button>
                  </>
                ) : (
                  <div style={{display:"flex",flexDirection:"column",gap:10,marginTop:8}}>
                    <button className="btn-outline" onClick={() => setEditMode(true)}>✏️ Редагувати дані</button>
                    <button className={selectedUser.banned?"btn-success":"btn-danger"} onClick={() => { toggleBan(selectedUser); setSelectedUser({...selectedUser,banned:!selectedUser.banned}); }}>{selectedUser.banned ? "✅ Розблокувати" : "⛔ Заблокувати"}</button>
                    <button className="btn-outline" onClick={() => { setReportTarget(selectedUser); setShowReportModal(true); }}>📢 Надіслати повідомлення</button>
                    <button className="btn-secondary" onClick={() => setSelectedUser(null)}>Закрити</button>
                  </div>
                )}
              </div>
            </div>
          )}

          {showReportModal && (
            <div className="modal-backdrop" onClick={e => e.target===e.currentTarget && setShowReportModal(false)}>
              <div className="modal-sheet">
                <div className="modal-handle" />
                <div className="modal-title">📢 Повідомлення для {reportTarget?.firstName}</div>
                <div className="input-group">
                  <div className="input-label">Тип</div>
                  <select className="select-field" value={reportType} onChange={e => setReportType(e.target.value)}>
                    {["Повідомлення","Попередження","Звіт","Рішення суду"].map(o => <option key={o}>{o}</option>)}
                  </select>
                </div>
                <div className="input-group"><div className="input-label">Заголовок</div><input className="input-field" value={reportTitle} onChange={e => setReportTitle(e.target.value)} placeholder="Заголовок повідомлення" /></div>
                <div className="input-group"><div className="input-label">Текст</div><textarea className="textarea-field" value={reportBody} onChange={e => setReportBody(e.target.value)} placeholder="Текст повідомлення..." /></div>
                <button className="btn-primary" onClick={sendReport}>Надіслати</button>
                <button className="btn-secondary" onClick={() => setShowReportModal(false)}>Скасувати</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ═══════════════════════════════════════════════════
    // ── NikusDiya — головний компонент ──
    // ═══════════════════════════════════════════════════
    function NikusDiya() {
      const [ready, setReady] = useState(false);
      const [user, setUser] = useState(null);
      const [profile, setProfile] = useState(null);
      const [loadingAuth, setLoadingAuth] = useState(true);
      const [tab, setTab] = useState("cabinet");
      const [unreadReports, setUnreadReports] = useState(0);

      useEffect(() => { waitForFb().then(() => setReady(true)); }, []);

      useEffect(() => {
        if (!ready) return;
        const auth = window._fbAuth; const db = window._fbDb;
        const unsub = window._fb.onAuthStateChanged(auth, async u => {
          setUser(u);
          if (u) {
            const snap = await window._fb.getDoc(window._fb.doc(db,"users",u.uid));
            setProfile(snap.exists() ? snap.data() : null);
          } else { setProfile(null); }
          setLoadingAuth(false);
        });
        return unsub;
      }, [ready]);

      useEffect(() => {
        if (!ready || !user || !profile) return;
        const db = window._fbDb;
        const { collection, query, where, onSnapshot } = window._fb;
        const q = query(collection(db,"reports"), where("userId","==",user.uid), where("read","==",false));
        const unsub = onSnapshot(q, snap => setUnreadReports(snap.size), err => console.error("unread badge:", err));
        return unsub;
      }, [ready, user, profile]);

      if (!ready || loadingAuth) return <div style={{display:"flex",justifyContent:"center",alignItems:"center",height:"100vh"}}><div className="spinner" /></div>;
      if (!user) return <AuthPage />;
      const isAdmin = user.email === ADMIN_EMAIL;
      if (isAdmin) return <AdminPanel adminProfile={profile || {uid:user.uid,email:user.email}} />;
      if (!profile) return <ProfileSetup user={user} onDone={async () => {
        const db = window._fbDb;
        const snap = await window._fb.getDoc(window._fb.doc(db,"users",user.uid));
        if (snap.exists()) setProfile(snap.data());
      }} />;
      if (profile.banned) return (
        <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",minHeight:"100vh",padding:32,background:"var(--bg)",gap:16}}>
          <div style={{fontSize:64}}>⛔</div>
          <div style={{fontFamily:"'Unbounded',sans-serif",fontSize:20,fontWeight:800,color:"var(--danger)",textAlign:"center"}}>Акаунт заблоковано</div>
          <div style={{fontSize:14,color:"var(--text2)",textAlign:"center"}}>Ваш акаунт було заблоковано суддею НікусДії.</div>
          <button className="btn-secondary" style={{width:"auto",padding:"12px 24px"}} onClick={() => window._fb.signOut(window._fbAuth)}>Вийти</button>
        </div>
      );

      const navItems = [
        {key:"cabinet", icon:"🪪", label:"Кабінет"},
        {key:"reports", icon:"📢", label:"Звіти", badge:unreadReports},
        {key:"court",   icon:"⚖️", label:"Суд"},
        {key:"history", icon:"📜", label:"Історія"},
        {key:"charts",  icon:"🧟", label:"Гра"},
      ];

      return (
        <div className="app-wrap">
          <div className="header">
            <div className="header-logo">НД</div>
            <div><div className="header-title">НікусДія</div><div className="header-sub">Цифровий документ</div></div>
            <button className="header-logout" onClick={() => window._fb.signOut(window._fbAuth)}>Вийти</button>
          </div>
          {tab==="cabinet" && <CabinetTab profile={profile} isAdmin={isAdmin} />}
          {tab==="reports" && <ReportsTab userId={user.uid} />}
          {tab==="court"   && <CourtTab userId={user.uid} profile={profile} />}
          {tab==="history" && <HistoryTab userId={user.uid} />}
          {tab==="charts"  && <ChartsTab userId={user.uid} profile={profile} />}
          <div className="bottom-nav">
            {navItems.map(n => (
              <button key={n.key} className={`nav-item${tab===n.key?" active":""}`} onClick={() => setTab(n.key)} style={{position:"relative"}}>
                <span className="nav-icon">{n.icon}</span>
                <span>{n.label}</span>
                {n.badge > 0 && <div className="notif-dot" />}
              </button>
            ))}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<NikusDiya />);
  </script>
</body>
</html>
